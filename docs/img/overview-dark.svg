<text x="464" y="408" class="lbl">does this row follow?</text>
<rect class="box" x="168" y="424" width="384" height="56" rx="8"/>
<text x="360" y="448" class="n" text-anchor="middle">OWL 2 DL engines</text>
<text x="360" y="467" class="d" text-anchor="middle">under owl2-dl, when cheaper checks can't decide</text>
