  .panel { fill: #161B22; }
  .t { font-size: 18px; font-weight: 600; }
  .n { font-size: 16px; font-weight: 600; }
  .d { font-size: 14px; fill: #9AA6B4; }
  .lbl { font-size: 14px; fill: #9AA6B4; }
  .r { font-size: 14px; }
  .lvl { font-size: 22px; font-weight: 600; fill: #9AA6B4; }
  .band { fill: #262D37; }
  .boundary { fill: none; stroke: #5A6573; stroke-width: 1.2; stroke-dasharray: 6 5; }
  .box { fill: #0D1117; stroke: #5A6573; stroke-width: 1.2; }
  .chip { fill: #0D1117; stroke: #5A6573; stroke-width: 1; }
  .client { fill: #E6EDF3; }
  .client-t { fill: #0D1117; font-size: 16px; font-weight: 600; }
  .commit { fill: #2A2340; stroke: #B69CF2; stroke-width: 2; }
  .commit-chip { fill: #0D1117; stroke: #B69CF2; stroke-width: 1; }
  .query { fill: #16302E; stroke: #4CC2B7; stroke-width: 2; }
  .query-chip { fill: #0D1117; stroke: #4CC2B7; stroke-width: 1; }
  .asserted { fill: #262D37; stroke: #5A6573; stroke-width: 1; }
  .inferred { fill: #2A2340; stroke: #B69CF2; stroke-width: 1; }
  .w-tell { fill: #B69CF2; font-weight: 600; font-size: 15px; }
  .w-ask { fill: #4CC2B7; font-weight: 600; font-size: 15px; }
  .w-refuse { fill: #F2747B; font-weight: 600; font-size: 15px; }
  .a { fill: none; stroke-width: 1.6; }
  .a-ink { stroke: #9AA6B4; }
  .a-tell { stroke: #B69CF2; }
  .a-ask { stroke: #4CC2B7; }
  .a-refuse { stroke: #F2747B; stroke-dasharray: 5 4; }
  .m-ink { fill: #9AA6B4; }
  .m-tell { fill: #B69CF2; }
  .m-ask { fill: #4CC2B7; }
  .m-refuse { fill: #F2747B; }
</style>
<defs><marker id="h-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-ink" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-tell" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-tell" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-ask" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-refuse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-refuse" d="M0 0 L10 5 L0 10 z"/></marker></defs>
