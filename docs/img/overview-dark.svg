<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 728" width="720" height="728" role="img" aria-labelledby="title desc">
<!-- The light and dark variants of this drawing differ only in <style>. -->
<title id="title">How NRESE fits together</title>
<desc id="desc">Your application tells NRESE something with SPARQL Update or the Graph Store protocol, and asks with a SPARQL query. A write is one commit, all of it or none: when reasoning is on, the reasoner infers and checks consistency, and SHACL validates when its gate is on. The commit writes asserted and inferred statements, kept apart, as one revision. A query never waits for a write: it reads a snapshot, and its status says whether rows may be missing. Under owl2-dl, where cheaper checks can't decide, the commit asks the OWL 2 DL engines whether the data is consistent, and the query asks whether a row follows. Storage is in memory, or on disk, where the data directory holds the log and checkpoints. Each arrow points from the part that calls to the part it calls.</desc>
<style>
