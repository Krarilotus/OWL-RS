<title id="title">Point-in-time restore</title>
<desc id="desc">The log lies in two parts, oldest first: wal-archive/, then wal/. A restore places an image at revision R, at or before the target N, a revision or a time, and replays the commits R+1 to N from the log; the log before the image and after the target is not replayed.</desc>
<style>
