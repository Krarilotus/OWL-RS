<title id="title">Where an OWL 2 DL answer's rows come from</title>
<desc id="desc">The possible rows are an over-estimate of the answer. Inside them are the certain rows: from your statements, what the rules derive and the class hierarchy. Rows in between are tested where they can be, within a budget: a proven row is added to the answer, a refuted row is dropped, and an undecided row is left out. A row left out keeps the answer from complete; the conditions below must hold too.</desc>
