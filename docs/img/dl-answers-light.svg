  .seg-on-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; font-weight: 600; }
  .refused { fill: #B42318; }
  .refused-text { fill: #B42318; font-weight: 600; }
