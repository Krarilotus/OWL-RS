<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 581" width="400" height="581" role="img" aria-labelledby="title desc">
<!-- Generated; the light and dark variants differ only in <style>. -->
<title id="title">What happens to a write</title>
<desc id="desc">A write goes through four steps in order. Apply works out the change, and no query sees it yet; it is refused if not allowed or invalid. Reasoning, when it is on, updates the inferred statements; it is refused if found to make the data inconsistent. Under owl2-dl, a check that runs out of its own budget doesn't refuse; consistency is then unknown. SHACL, when it is on, checks the data the write can affect against your shapes; with enforce it is refused if it introduces a violation or a shape can't be checked. The request's deadline or memory stops the write up to here. Publish: the asserted and inferred changes become one revision, on disk saved before you get the answer. A refused write commits nothing; the response says why.</desc>
