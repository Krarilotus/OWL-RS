<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" width="400" height="390" role="img" aria-labelledby="title desc">
<!-- Generated; the light and dark variants differ only in <style>. -->
<title id="title">How the memory limits nest</title>
<desc id="desc">The process (budgets.process_memory) holds the limit shared by every repository (budgets.total_query_memory): what requests reserve, and the state kept between them. Inside it, one query has its own limit (budgets.query_memory): its tables, kept results and DL work. Any other request has no limit of its own. Each level counts what work reserves, not all memory held; 0 turns it off. A bulk load is limited apart (budgets.bulk_load_memory).</desc>
