  .chip-on-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #FFFFFF; }
  .asserted { fill: #FFFFFF; stroke: #8C959F; stroke-width: 1.1; }
  .inferred { fill: #FFF3D6; stroke: #D4A72C; stroke-width: 1.1; }
  .inferred-text { font-size: 16px; font-weight: 600; fill: #8A5300; }
  .track { fill: #E6EAEF; }
  .frame { fill: none; stroke: #8C959F; stroke-width: 1.25; }
  .divider { fill: none; stroke: #8C959F; stroke-width: 1.25; }
  .mark { fill: none; stroke: #1F2328; stroke-width: 2; }
  .seg-on { fill: #FFFFFF; stroke: #8C959F; stroke-width: 1; }
  .seg-on-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; font-weight: 600; }
  .refused { fill: #B42318; }
  .refused-text { fill: #B42318; font-weight: 600; }
  .inferred-word { fill: #8A5300; font-weight: 600; }
  .flow { fill: none; stroke: #59636E; stroke-width: 1.4; }
