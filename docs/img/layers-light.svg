<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 860" width="792" height="860" role="img" aria-labelledby="title desc">
<!-- The light and dark variants of this drawing differ only in <style>. -->
<title id="title">NRESE's layers</title>
<desc id="desc">NRESE's parts by layer; each uses only parts below it, and parts side by side don't use each other. L5: apps/nrese-console, the browser UI and CLI, an npm package that uses the server over HTTP. The crates: L4: nrese-server. L3: nrese-store. L2: nrese-shacl above nrese-sparql and nrese-reasoner. L1: nrese-engine and nrese-dl, above nrese-vector, above nrese-exec and nrese-owl. L0, in crates/rdf/: nrese-rdf-io, nrese-sparql-syntax and nrese-sparql-results, above nrese-rdf, above nrese-json and nrese-xsd.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1B2330; }
  .panel { fill: #F4F6F9; }
  .t { font-size: 18px; font-weight: 600; }
  .n { font-size: 16px; font-weight: 600; }
  .d { font-size: 14px; fill: #566173; }
  .lbl { font-size: 14px; fill: #566173; }
  .r { font-size: 14px; }
  .lvl { font-size: 22px; font-weight: 600; fill: #566173; }
  .band { fill: #E3E7ED; }
  .boundary { fill: none; stroke: #9AA4B2; stroke-width: 1.2; stroke-dasharray: 6 5; }
  .box { fill: #FFFFFF; stroke: #9AA4B2; stroke-width: 1.2; }
  .chip { fill: #FFFFFF; stroke: #9AA4B2; stroke-width: 1; }
  .client { fill: #1B2330; }
  .client-t { fill: #FFFFFF; font-size: 16px; font-weight: 600; }
  .commit { fill: #EEE8F8; stroke: #6440A8; stroke-width: 2; }
  .commit-chip { fill: #FFFFFF; stroke: #6440A8; stroke-width: 1; }
  .query { fill: #E3F2F0; stroke: #0B766F; stroke-width: 2; }
  .query-chip { fill: #FFFFFF; stroke: #0B766F; stroke-width: 1; }
  .asserted { fill: #E3E7ED; stroke: #9AA4B2; stroke-width: 1; }
  .inferred { fill: #EEE8F8; stroke: #6440A8; stroke-width: 1; }
  .w-tell { fill: #6440A8; font-weight: 600; font-size: 15px; }
  .w-ask { fill: #0B766F; font-weight: 600; font-size: 15px; }
  .w-refuse { fill: #B42330; font-weight: 600; font-size: 15px; }
  .a { fill: none; stroke-width: 1.6; }
  .a-ink { stroke: #566173; }
  .a-tell { stroke: #6440A8; }
  .a-ask { stroke: #0B766F; }
  .a-refuse { stroke: #B42330; stroke-dasharray: 5 4; }
  .m-ink { fill: #566173; }
  .m-tell { fill: #6440A8; }
  .m-ask { fill: #0B766F; }
  .m-refuse { fill: #B42330; }
</style>
<defs><marker id="h-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-ink" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-tell" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-tell" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-ask" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-refuse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-refuse" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="panel" x="0" y="0" width="792" height="860" rx="14"/>
<rect class="band" x="20" y="20" width="772" height="80" rx="10"/>
<text x="40" y="54" class="lvl">L5</text>
<text x="40" y="74" class="d">clients</text>
<rect class="chip" x="160" y="36" width="616" height="48" rx="6"/>
<text x="174.0" y="57" class="n">apps/nrese-console</text>
<text x="174.0" y="75" class="d">browser UI and CLI over HTTP; an npm package, not a crate</text>
