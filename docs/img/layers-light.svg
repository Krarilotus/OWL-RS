<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 652" width="400" height="652" role="img" aria-labelledby="title desc">
<!-- Generated; the light and dark variants differ only in <style>. -->
<title id="title">NRESE's crates by layer</title>
<desc id="desc">Each crate uses only crates in rows below it, never one beside it; every name starts with nrese-. The console, apps/nrese-console, is an npm app, not a crate: it uses the server over HTTP. L4: nrese-server. L3: nrese-store. L2, query, reasoning, validation: nrese-shacl, above nrese-sparql and nrese-reasoner. L1, storage, execution and OWL: nrese-engine and nrese-dl, above nrese-vector, above nrese-exec and nrese-owl. L0, the RDF model and syntaxes, in crates/rdf/: nrese-rdf-io, nrese-sparql-syntax and nrese-sparql-results, above nrese-rdf, above nrese-json and nrese-xsd.</desc>
<style>
