  .edge { font-size: 14px; font-style: italic; fill: #59636E; }
  .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
  .box { fill: #FFFFFF; stroke: #8C959F; stroke-width: 1.25; }
  .band { fill: #F6F8FA; }
  .chip { fill: #FFFFFF; stroke: #8C959F; stroke-width: 1.1; }
