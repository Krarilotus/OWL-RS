<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 683" width="400" height="683" role="img" aria-labelledby="title desc">
<!-- Generated; the light and dark variants differ only in <style>. -->
<title id="title">What runs</title>
<desc id="desc">Clients reach your TLS proxy over HTTPS, and the proxy reaches nrese-server over HTTP, over loopback or a private network. On the server's machine, nrese-server is one process: the HTTP APIs, /ops, and /console when the console is built in. It reads and writes its data directory, on disk only. For the default repository: checkpoint-*.nck, the saved state; wal/, the writes since then; wal-archive/, the older log, if kept; and repositories/&lt;id&gt;/ holds each other repository, laid out alike. The directory is locked: one process at a time. On another machine, if you want one, a read replica, a second nrese-server that answers queries from its own data directory on disk, both servers set up for replication, pulls the server's log over HTTP.</desc>
