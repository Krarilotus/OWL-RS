<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 511" width="400" height="511" role="img" aria-labelledby="title desc">
<!-- Generated; the light and dark variants differ only in <style>. -->
<title id="title">Invalid statements in a bulk load</title>
<desc id="desc">A bulk load sends valid statements to the data, what queries, reasoning and exports see. A statement with a syntax error goes to the quarantine, kept with its file and reason, and its text and line where known; it is not data. Re-admission, drawn dashed: fixed if need be, it is checked like any write; refused, it stays in quarantine; otherwise it becomes data. Today re-admission is a store function only; its HTTP API and command are proposed. With --strict, a syntax error stops the whole load, and none of it is committed.</desc>
