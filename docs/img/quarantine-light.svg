<!-- Generated; the light and dark variants differ only in <style>. -->
<title id="title">Invalid statements in a bulk load</title>
<desc id="desc">A bulk load sends valid statements to the data, what queries, reasoning and exports see. A statement with a syntax error goes to the quarantine, kept with its file and reason, and its text and line where known; it is not data. Re-admission, drawn dashed: fixed if need be, it is checked like any write; refused, it stays in quarantine; otherwise it becomes data. Today re-admission is a store function only; its HTTP API and command are proposed. A cut-off file, or another error the loader can't read past, stops the whole load, as a syntax error does with --strict; none of it is committed.</desc>
