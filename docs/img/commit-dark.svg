<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 484" width="580" height="484" role="img" aria-labelledby="title desc">
<!-- The light and dark variants of this drawing differ only in <style>. -->
<title id="title">What a commit does</title>
<desc id="desc">A write is planned under the single writer slot on a snapshot. With reasoning on, the reasoner derives the inferences and checks consistency, and under owl2-dl the DL engines check it too. With the SHACL gate on, the shapes validate what the change can affect. A failed check or a timeout refuses the write and nothing is committed; otherwise asserted and inferred changes are logged and published as one revision, seen whole by every query.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #E6EDF3; }
  .panel { fill: #161B22; }
  .t { font-size: 18px; font-weight: 600; }
  .n { font-size: 16px; font-weight: 600; }
  .d { font-size: 14px; fill: #9AA6B4; }
  .lbl { font-size: 14px; fill: #9AA6B4; }
  .lvl { font-size: 22px; font-weight: 600; fill: #9AA6B4; }
  .band { fill: #262D37; }
  .boundary { fill: none; stroke: #5A6573; stroke-width: 1.2; stroke-dasharray: 6 5; }
  .box { fill: #0D1117; stroke: #5A6573; stroke-width: 1.2; }
  .chip { fill: #0D1117; stroke: #5A6573; stroke-width: 1; }
  .client { fill: #E6EDF3; }
  .client-t { fill: #0D1117; font-size: 16px; font-weight: 600; }
  .commit { fill: #2A2340; stroke: #B69CF2; stroke-width: 2; }
  .commit-chip { fill: #0D1117; stroke: #B69CF2; stroke-width: 1; }
  .query { fill: #16302E; stroke: #4CC2B7; stroke-width: 2; }
  .query-chip { fill: #0D1117; stroke: #4CC2B7; stroke-width: 1; }
  .asserted { fill: #262D37; stroke: #5A6573; stroke-width: 1; }
  .inferred { fill: #2A2340; stroke: #B69CF2; stroke-width: 1; }
  .w-tell { fill: #B69CF2; font-weight: 600; font-size: 15px; }
  .w-ask { fill: #4CC2B7; font-weight: 600; font-size: 15px; }
  .w-refuse { fill: #F2747B; font-weight: 600; font-size: 15px; }
  .a { fill: none; stroke-width: 1.6; }
  .a-ink { stroke: #9AA6B4; }
  .a-tell { stroke: #B69CF2; }
  .a-ask { stroke: #4CC2B7; }
  .a-refuse { stroke: #F2747B; stroke-dasharray: 5 4; }
  .m-ink { fill: #9AA6B4; }
  .m-tell { fill: #B69CF2; }
  .m-ask { fill: #4CC2B7; }
  .m-refuse { fill: #F2747B; }
</style>
<defs><marker id="h-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-ink" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-tell" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-tell" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-ask" d="M0 0 L10 5 L0 10 z"/></marker><marker id="h-refuse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-refuse" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="panel" x="0" y="0" width="580" height="484" rx="14"/>
<rect class="client" x="74" y="20" width="200" height="40" rx="20"/>
<text x="174" y="45" class="client-t" text-anchor="middle">a write</text>
<path class="a a-tell" d="M174 60 V82" marker-end="url(#h-tell)"/>
<rect class="commit-chip" x="24" y="84" width="300" height="56" rx="6"/>
<text x="42" y="107" class="n">Plan</text>
<text x="42" y="127" class="d">writer slot, snapshot, the change</text>
<path class="a a-tell" d="M174 140 V166" marker-end="url(#h-tell)"/>
<rect class="commit-chip" x="24" y="168" width="300" height="56" rx="6"/>
<text x="42" y="191" class="n">Infer and check</text>
<text x="42" y="211" class="d">reasoner; DL engines under owl2-dl</text>
<path class="a a-tell" d="M174 224 V250" marker-end="url(#h-tell)"/>
<rect class="commit-chip" x="24" y="252" width="300" height="56" rx="6"/>
<text x="42" y="275" class="n">Validate</text>
<text x="42" y="295" class="d">SHACL, when the gate is on</text>
<path class="a a-tell" d="M174 308 V334" marker-end="url(#h-tell)"/>
<rect class="commit-chip" x="24" y="336" width="300" height="56" rx="6"/>
<text x="42" y="359" class="n">Log and publish</text>
<text x="42" y="379" class="d">one revision, asserted and inferred</text>
<path class="a a-tell" d="M174 392 V418" marker-end="url(#h-tell)"/>
<rect class="commit" x="44" y="420" width="260" height="40" rx="20"/>
<text x="174" y="445" class="n" text-anchor="middle">seen whole by every query</text>
<path class="a a-refuse" d="M324 196 H370" marker-end="url(#h-refuse)"/>
<path class="a a-refuse" d="M324 280 H370" marker-end="url(#h-refuse)"/>
<rect class="box" x="372" y="172" width="184" height="132" rx="8"/>
<text x="390" y="202" class="w-refuse">Refused</text>
<text x="390" y="228" class="d">nothing committed,</text>
<text x="390" y="248" class="d">the response says why.</text>
<text x="390" y="278" class="d">So does a timeout.</text>
</svg>
