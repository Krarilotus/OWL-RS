# Methods only named callers may use: each allowed call site carries `#[allow(clippy::disallowed_methods)]`.
disallowed-methods = [
    # REAS-3 (master, 9 Nov 01:37): a counted snapshot's data is read only counted, so a reader's stop sees the
    # engine's work; the way back to the uncounted snapshot is for readers that run to their end or hand the
    # snapshot on unread. Its callers: none yet.
    { path = "nrese_engine::CountedSnapshot::uncounted", reason = "a counted snapshot's reads are counted (REAS-3); only named callers read it uncounted" },
]
