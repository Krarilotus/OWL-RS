description = """The first example (README.md, "A first answer", and docs/tutorial.md), as
written there: under owl2-dl with the SHACL gate enforcing, a cat is an animal by a rule, and a
pet, which is a cat or a dog, is an animal only through the union, which the OWL 2 DL engines
prove: both rows, and the answer is complete; reading asserted
statements only (infer=false) finds none, with a complete answer; deleting the premises leaves
no animal; a shape in the shapes graph makes the gate reject an unnamed
cat (400, a SHACL Reject problem) and nothing of it remains; with a name the commit passes."""

[server]
set = { "reasoner.mode" = "owl2-dl", "shacl.gate" = "enforce" }

[vars]
prefix = "PREFIX ex: <http://example.org/>"
animals = "PREFIX ex: <http://example.org/> SELECT ?x WHERE { ?x a ex:Animal }"

[[step]]
name = "cats and dogs are animals, a pet is a cat or a dog, tom is a cat and rex a pet"
method = "POST"
path = "/dataset/update"
form = { update = "${prefix} PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#> PREFIX owl: <http://www.w3.org/2002/07/owl#> INSERT DATA { ex:Cat rdfs:subClassOf ex:Animal . ex:Dog rdfs:subClassOf ex:Animal . ex:Pet rdfs:subClassOf [ owl:unionOf (ex:Cat ex:Dog) ] . ex:tom a ex:Cat . ex:rex a ex:Pet }" }
[step.expect]
status = [200, 204]

[[step]]
name = "tom by a rule and rex through the union: both rows, complete"
method = "POST"
path = "/dataset/query"
form = { query = "${animals}" }
headers = { Accept = "application/sparql-results+json" }
[step.expect]
status = 200
headers = { nrese-completeness = "complete; regime=owl2-dl" }
rows = 2
json = { "$.results.bindings[*].x.value" = { length = 2, matches = '^(?=.*"http://example\.org/rex")(?=.*"http://example\.org/tom")' } }

[[step]]
name = "asserted statements only: no animal, complete"
method = "POST"
path = "/dataset/query"
form = { query = "${animals}", infer = "false" }
headers = { Accept = "application/sparql-results+json" }
[step.expect]
status = 200
headers = { nrese-completeness = "complete" }
rows = 0

[[step]]
name = "delete the premises"
method = "POST"
path = "/dataset/update"
form = { update = "${prefix} DELETE DATA { ex:tom a ex:Cat . ex:rex a ex:Pet }" }
[step.expect]
status = [200, 204]

[[step]]
name = "no animal is left"
method = "POST"
path = "/dataset/query"
form = { query = "${animals}" }
headers = { Accept = "application/sparql-results+json" }
[step.expect]
status = 200
rows = 0

[[step]]
name = "every animal needs a name"
method = "POST"
path = "/dataset/update"
form = { update = "${prefix} PREFIX sh: <http://www.w3.org/ns/shacl#> INSERT DATA { GRAPH <http://rdf4j.org/schema/rdf4j#SHACLShapeGraph> { ex:AnimalShape a sh:NodeShape ; sh:targetClass ex:Animal ; sh:property [ sh:path ex:name ; sh:minCount 1 ] } }" }
[step.expect]
status = [200, 204]

[[step]]
name = "the gate rejects an unnamed cat"
method = "POST"
path = "/dataset/update"
form = { update = "${prefix} INSERT DATA { ex:felix a ex:Cat }" }
[step.expect]
status = 400
headers = { content-type = { contains = "application/problem+json" } }
json = { "$.title" = "SHACL Reject", "$.type" = "https://nrese.dev/problems/shacl-reject", "$.detail" = { contains = "focus node <http://example.org/felix>" } }

[[step]]
name = "nothing of the rejected commit remains"
method = "POST"
path = "/dataset/query"
form = { query = "${animals}" }
headers = { Accept = "application/sparql-results+json" }
[step.expect]
status = 200
rows = 0

[[step]]
name = "with a name the commit passes"
method = "POST"
path = "/dataset/update"
form = { update = "${prefix} INSERT DATA { ex:felix a ex:Cat ; ex:name \"Felix\" }" }
[step.expect]
status = [200, 204]

[[step]]
name = "felix is an animal"
method = "POST"
path = "/dataset/query"
form = { query = "${animals}" }
headers = { Accept = "application/sparql-results+json" }
[step.expect]
status = 200
rows = 1
json = { "$.results.bindings[*].x.value" = { contains = "http://example.org/felix" } }
