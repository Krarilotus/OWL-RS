[workspace]
members = [
    "crates/nrese-core",
    "crates/nrese-engine",
    "crates/nrese-exec",
    "crates/nrese-sparql",
    "crates/nrese-shacl",
    "crates/nrese-store",
    "crates/nrese-reasoner",
    "crates/nrese-server",
]
# Patched copies of published crates, used through [patch.crates-io] below.
exclude = ["vendor"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Krarilotus/OWL-RS"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"

# Pf7a, measured with the perf lab (benches/baselines/perf-lab/2026-09-27-*): fat LTO with one
# codegen unit cut the query sets' sum of p50 by 8-19% on top of mimalloc. Unwinding stays on:
# the server isolates panics per request.
[profile.release]
lto = "fat"
codegen-units = 1

# `cargo build --profile profiling`: release code with symbols, for perf/samply.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# oxsdatatypes 0.2.2 with decimal multiplication and division fixed for zero operands and
# products past 18 fractional digits (vendor/oxsdatatypes/NRESE-PATCH.md). The bench
# harness, a workspace of its own, patches it the same way.
[patch.crates-io]
oxsdatatypes = { path = "vendor/oxsdatatypes" }
