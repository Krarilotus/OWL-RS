[package]
name = "nrese-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Replication's image transfer (src/replication.rs).
tempfile = { workspace = true }
anyhow.workspace = true
async-trait.workspace = true
axum = { version = "0.8.8", features = ["json", "query"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3", default-features = false }
jsonwebtoken = "9.3.1"
mimalloc = { workspace = true }
# mimalloc's `mi_collect`: memory given back after bulk loads and reasoning.
libmimalloc-sys = { workspace = true }
nrese-rdf = { path = "../rdf/nrese-rdf" }
nrese-reasoner = { path = "../nrese-reasoner" }
nrese-sparql = { path = "../nrese-sparql" }
nrese-store = { path = "../nrese-store", features = ["openapi"] }
parking_lot = { workspace = true }
# rustls only (no OpenSSL: the binary needs no system TLS library), trusting the bundled
# roots and the machine's CA store (an identity provider with an internal certificate).
reqwest = { version = "0.12.24", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_urlencoded = "0.7.1"
base64 = "0.22.1"
utoipa = { workspace = true, features = ["preserve_order"] }
nrese-sparql-results = { path = "../rdf/nrese-sparql-results" }
thiserror.workspace = true
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net"] }
toml = "0.9.8"
tower-http = { version = "0.6.8", features = ["request-id", "trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
# A paused clock that tests advance themselves: deadlines decided without real time.
tokio = { version = "1.48.0", features = ["test-util"] }

[lints]
workspace = true
