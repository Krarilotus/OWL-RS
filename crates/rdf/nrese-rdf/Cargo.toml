[package]
name = "nrese-rdf"
description = "NRESE's RDF model: IRIs, terms, triples, quads, graphs and datasets, vocabularies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["xsd", "rdfc"]
# Literals from and to the XSD values of nrese-xsd.
xsd = ["dep:nrese-xsd"]
# RDF Dataset Canonicalization (RDFC-1.0), with its hash functions.
rdfc = ["dep:sha2"]

[dependencies]
foldhash = { workspace = true }
nrese-xsd = { path = "../nrese-xsd", optional = true }
rand = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true

[lints]
workspace = true
