[package]
name = "nrese-rdf-io"
description = "NRESE's RDF readers and writers: N-Triples, N-Quads, Turtle, TriG, RDF/XML, JSON-LD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
foldhash = "0.2"
memchr = "2.8"
nrese-json = { path = "../nrese-json" }
nrese-rdf = { path = "../nrese-rdf", default-features = false }
quick-xml = "0.42"
thiserror.workspace = true

[dev-dependencies]
# The W3C RDFC-1.0 suite runs here, where N-Quads can be read.
nrese-rdf = { path = "../nrese-rdf", default-features = false, features = ["rdfc"] }

[lints]
workspace = true
