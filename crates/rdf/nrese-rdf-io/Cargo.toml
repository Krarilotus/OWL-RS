[package]
name = "nrese-rdf-io"
description = "NRESE's RDF readers and writers: N-Triples, N-Quads, Turtle, TriG, RDF/XML, JSON-LD"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
memchr = "2.8"
nrese-rdf = { path = "../nrese-rdf", default-features = false }
