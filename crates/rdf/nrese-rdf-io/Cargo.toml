[package]
name = "nrese-rdf-io"
description = "NRESE's RDF readers and writers: N-Triples, N-Quads, Turtle, TriG, RDF/XML, JSON-LD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true


# Test binaries that take more than ~15 s (the W3C N3 suites): the push tier runs them when this
# crate changed, the commit tier never (scripts/check.sh).
[package.metadata.nrese]
slow-tests = ["w3c_n3"]
[dependencies]
foldhash = { workspace = true }
memchr = { workspace = true }
nrese-json = { path = "../nrese-json" }
nrese-rdf = { path = "../nrese-rdf", default-features = false }
quick-xml = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
# The W3C RDFC-1.0 suite runs here, where N-Quads can be read.
nrese-rdf = { path = "../nrese-rdf", default-features = false, features = ["rdfc"] }

[lints]
workspace = true
