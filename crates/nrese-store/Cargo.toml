[package]
name = "nrese-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nrese-core = { path = "../nrese-core" }
nrese-engine = { path = "../nrese-engine" }
nrese-reasoner = { path = "../nrese-reasoner" }
nrese-shacl = { path = "../nrese-shacl" }
nrese-sparql = { path = "../nrese-sparql" }
oxrdf = "=0.3.3"
oxrdfio = "=0.2.4"
oxttl = "=0.2.3"
rayon = "1.10"
sha2 = "0.10.9"
sparesults = "=0.3.3"
spargebra = "=0.4.6"
thiserror.workspace = true
tracing.workspace = true
url = "2.5.7"

[dev-dependencies]
mimalloc = { version = "0.1", default-features = false }
tempfile = "3.23.0"

[lints.rust]
# `--cfg system_alloc` switches the perf lab to the system allocator (benches/perf-lab.sh).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(system_alloc)"] }
