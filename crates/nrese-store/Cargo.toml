[package]
name = "nrese-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
nrese-core = { path = "../nrese-core" }
nrese-engine = { path = "../nrese-engine" }
nrese-reasoner = { path = "../nrese-reasoner" }
nrese-shacl = { path = "../nrese-shacl" }
nrese-sparql = { path = "../nrese-sparql" }
nrese-rdf = { path = "../rdf/nrese-rdf" }
nrese-xsd = { path = "../rdf/nrese-xsd" }
nrese-rdf-io = { path = "../rdf/nrese-rdf-io" }
rayon = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
argon2 = "0.6.0"
getrandom = "0.4.2"
utoipa = { version = "6.0.0", optional = true }
nrese-sparql-results = { path = "../rdf/nrese-sparql-results" }
nrese-sparql-syntax = { path = "../rdf/nrese-sparql-syntax" }
thiserror.workspace = true
tracing.workspace = true
url = "2.5.7"

[features]
# Schemas of the types the engine API returns, for its OpenAPI description.
openapi = ["dep:utoipa"]

[dev-dependencies]
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
mimalloc = { version = "0.1", default-features = false }
tempfile = "3.23.0"

[lints]
workspace = true
