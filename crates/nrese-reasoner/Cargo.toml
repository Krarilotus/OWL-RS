[package]
name = "nrese-reasoner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
nrese-core = { path = "../nrese-core" }
nrese-exec = { path = "../nrese-exec" }
# User rules in Notation3 (v2::n3).
nrese-rdf = { path = "../rdf/nrese-rdf", default-features = false }
nrese-rdf-io = { path = "../rdf/nrese-rdf-io" }
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher", "inline-more"] }
rayon = "1.10"
thiserror.workspace = true

[features]
# The naive reference evaluator (v2::naive), the oracle the executors are tested against.
oracle = []

[dev-dependencies]
# Its own tests and examples use the oracle.
nrese-reasoner = { path = ".", features = ["oracle"] }

[lints]
workspace = true
