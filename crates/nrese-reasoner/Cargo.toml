[package]
name = "nrese-reasoner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
smallvec = { workspace = true }
nrese-core = { path = "../nrese-core" }
nrese-exec = { path = "../nrese-exec" }
# The proof IR justifications are computed on (v2::explain).
nrese-owl = { path = "../nrese-owl" }
# User rules in Notation3 (v2::n3).
nrese-rdf = { path = "../rdf/nrese-rdf", default-features = false }
nrese-rdf-io = { path = "../rdf/nrese-rdf-io" }
hashbrown = { workspace = true }
rayon = { workspace = true }
thiserror.workspace = true

[features]
# The naive reference evaluator (v2::naive), the oracle the executors are tested against.
oracle = []

[dev-dependencies]
# Its own tests and examples use the oracle.
nrese-reasoner = { path = ".", features = ["oracle"] }

[lints]
workspace = true
