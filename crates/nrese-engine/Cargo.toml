[package]
name = "nrese-engine"
description = "NRESE storage engine: term dictionary, quad permutation indexes, MVCC snapshots, transactions, durability"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aho-corasick = "1.1"
crc32fast = "1.5"
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher", "inline-more"] }
memchr = "2.8"
memmap2 = "0.9"
nrese-rdf = { path = "../rdf/nrese-rdf" }
nrese-rdf-io = { path = "../rdf/nrese-rdf-io" }
parking_lot = "0.12"
rayon = "1.10"
rust-stemmers = "1.2"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# FSST for the vocabulary study (src/term/vocabulary_study.rs); Apache-2.0.
fsst = { package = "fsst-rs", version = "0.6" }
tempfile = "3.23.0"
