[package]
name = "nrese-engine"
description = "NRESE storage engine: term dictionary, quad permutation indexes, MVCC snapshots, transactions, durability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aho-corasick = "1.1"
crc32fast = "1.5"
# FSST-compressed vocabularies (src/term/vocabulary.rs); Apache-2.0. Pinned: a checkpoint
# charges FSST's training and tables as constants measured on this version
# (vocabulary::TRAINING_BYTES, CODEC_HELD); a new version is measured again
# (durability::checkpoint's the_dictionary_section_holds_what_it_charged).
fsst = { package = "fsst-rs", version = "=0.6.0" }
hashbrown = { workspace = true }
memchr = { workspace = true }
memmap2 = "0.9"
# The kernels shared with the reasoner and the query engine: the union of the equality
# classes (src/engine/equality.rs), the sort.
nrese-exec = { path = "../nrese-exec" }
nrese-rdf = { path = "../rdf/nrese-rdf" }
nrese-rdf-io = { path = "../rdf/nrese-rdf-io" }
nrese-vector = { path = "../nrese-vector" }
parking_lot = { workspace = true }
rayon = { workspace = true }
rust-stemmers = "1.2"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
# Measurements against budgets (tests/corpus_measure.rs, tests/canonical_view_memory.rs),
# and the unit tests' counting allocator (src/lib.rs) checks that what the statistics keep is
# what they charge; measuring without its allocator fails (tests/measure_without_its_allocator.rs).
nrese-exec = { path = "../nrese-exec", features = ["measure"] }

[lints]
workspace = true
