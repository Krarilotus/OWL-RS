[package]
name = "nrese-exec"
description = "NRESE execution core: id tables, joins, sorting and aggregation shared by SPARQL and reasoning (D11)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The counting allocator and measurements (src/measure.rs), for other crates' tests: a
# dev-dependency with this feature. Never in product builds.
measure = ["dep:parking_lot_core"]

[dependencies]
foldhash = { workspace = true }
hashbrown = { workspace = true }
rayon = { workspace = true }
# Warmed before measurements (src/measure.rs): its waiter table, grown once per process.
parking_lot_core = { version = "0.9", optional = true }

[dev-dependencies]
parking_lot_core = "0.9"

# The process's and the machine's memory (memory.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[lints]
workspace = true
