[package]
name = "nrese-sparql"
description = "NRESE SPARQL layer: spareval over nrese-engine snapshots and transactions, update execution"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rayon = "1.10"
nrese-engine = { path = "../nrese-engine" }
nrese-exec = { path = "../nrese-exec" }
oxsdatatypes = "=0.2.2"
regex = "1.12"
oxrdf = "=0.3.3"
# SPARQL functions (RAND, UUID, the hashes, IRI against BASE): the crates spareval uses.
# GeoSPARQL: geometries and their relations; WKT, GeoJSON and GML literals.
geo = "0.33"
quick-xml = "0.37"
rstar = "0.12"
serde_json = "1.0.145"
wkt = "0.14"
hex = "0.4"
md-5 = "0.10"
oxiri = "0.2"
rand = "0.9"
sha1 = "0.10"
sha2 = "0.10"
spareval = { version = "=0.2.6", features = ["sep-0002", "calendar-ext"] }
spargebra = "=0.4.6"
thiserror.workspace = true

[dev-dependencies]
# Differential oracle: the same spareval evaluator over Oxigraph's own storage.
oxigraph = { version = "0.5.6", default-features = false }
# W3C suite runner: manifests, data files and expected results.
oxrdfio = "=0.2.4"
sparesults = "=0.3.3"
