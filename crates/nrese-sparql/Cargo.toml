[package]
name = "nrese-sparql"
description = "NRESE SPARQL layer: query and update execution over nrese-engine snapshots and transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rayon = { workspace = true }
nrese-engine = { path = "../nrese-engine" }
nrese-exec = { path = "../nrese-exec" }
nrese-xsd = { path = "../rdf/nrese-xsd" }
regex = { workspace = true }
# RDF terms and their XSD values.
nrese-rdf = { path = "../rdf/nrese-rdf" }
# SPARQL functions (RAND, UUID, the hashes, IRI against BASE).
# GeoSPARQL: geometries and their relations; WKT, GeoJSON and GML literals.
geo = "0.33"
quick-xml = { workspace = true }
rstar = "0.12"
serde_json = { workspace = true }
wkt = "0.14"
hex = "0.4"
md-5 = "0.10"
rand = { workspace = true }
sha1 = "0.10"
sha2 = { workspace = true }
nrese-sparql-syntax = { path = "../rdf/nrese-sparql-syntax" }
# Results terms written exactly as the results serialiser writes them.
nrese-sparql-results = { path = "../rdf/nrese-sparql-results" }
thiserror.workspace = true

[dev-dependencies]
# The GeoSPARQL compliance runner reasons over the benchmark's dataset (RDFS).
nrese-reasoner = { path = "../nrese-reasoner" }
# The differential tests' reference: the specification's algebra, evaluated plainly.
nrese-sparql-reference = { path = "../nrese-sparql-reference" }
# W3C suite runner: manifests, data files and expected results.
nrese-rdf-io = { path = "../rdf/nrese-rdf-io" }

[lints]
workspace = true
