# Deviations a matrix row may show, each with its witness under cases/. An entry forgives
# only its own case, step, entry point and kind, with exactly these counts, once per run.

[[gap]]
id = "shapes-change-repeats-shared-result"
says = "A shapes change keeps every later result absent before, so one new result reached from two targets is reported twice."
case = "row:shapes-shared-target"
step = 1
entry = "C2"
kind = "result"
direction = "duplicate"
witness = "shapes-change-repeats-shared-result.toml"

[gap.delta]
'ResultKey { focus: Rdf(NamedNode(NamedNode { iri: "http://example.com/n3" })), path: Some(Predicate(NamedNode { iri: "http://example.com/p0" })), value: None, shape: Rdf(NamedNode(NamedNode { iri: "http://example.com/Q" })), constraint: None, component: NamedNode { iri: "http://www.w3.org/ns/shacl#MaxCountConstraintComponent" }, severity: NamedNode { iri: "http://www.w3.org/ns/shacl#Violation" }, messages: [] }' = { expected = 1, actual = 2 }

[[gap]]
id = "excluded-edit-drops-failure"
says = "A data change whose statements are all outside the selected graphs skips validation, so it reports none of the later validation's failures."
case = "row:failure-excluded-edit"
step = 1
entry = "C1"
kind = "failure"
direction = "missed"
witness = "excluded-edit-drops-failure.toml"

[gap.delta]
'a SPARQL constraint at focus node <http://example.com/n5>: the query reported ?failure' = { expected = 1, actual = 0 }
