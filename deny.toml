# cargo-deny's checks (scripts/check.sh runs them): the licence policy of CONTRIBUTING.md
# (permissive only, so NRESE stays usable under MIT or Apache-2.0 alone; MPL-2.0 only
# unmodified and after asking, as an exception per crate), security advisories, duplicate
# versions, and where crates may come from.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# MPL-2.0 crates accepted after asking, unmodified (CONTRIBUTING.md).
exceptions = []

[advisories]
yanked = "deny"

[bans]
# Duplicate versions are reported, to be aligned over time; not yet an error.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
