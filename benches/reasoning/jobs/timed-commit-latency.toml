id = "reasoning-timed-commit-latency"
group = "reasoning"
host = "office-pc"
checkout = "suite/reasoning"
workload = "commit-latency"
window = "quiet"
priority = 2
est_min = 150
needs = ["docker"]
env = { NRESE_BIN = "/home/krarilotus/nrese-reasoning-suite/bin/16c3bfb/nrese-server", NRESE_VERSION = "16c3bfb", HARNESS = "/home/krarilotus/nrese-reasoning-suite/bin/16c3bfb/nrese-bench-harness", NRESE_LICENSES = "/home/krarilotus/nrese-assets/kraris-gptler-20261009/snapshots/windows/nrese-bench/licenses", DOCKER_MEMORY = "20g" }
# Two scenarios, reported apart (benches/PROTOCOL.md §3):
# - matched: one CPU for both, GraphDB Free's allocation (its licence: 1 core, two concurrent
#   queries; at 8 and 64 readers its numbers are Free's queueing, not GraphDB's scaling);
# - 8 CPUs: NRESE's own capacity, a line of its own. (RDFox's licence was refused; its
#   maintenance numbers are reported rows, benches/reasoning/reported.)
commands = [
  ["bash", "scripts/quiet-slot.sh", "sh", "-c", "test -f /home/krarilotus/owlrs/queue/done/reasoning-qualify-commit-latency.toml && DOCKER_CPUS=1 python3 benches/reasoning/maintenance/maintenance.py run --systems nrese,graphdb --tier lubm-10 --runs 3 --readers 0,1,2,8,64 --duration-s 60 --results \"$QUEUE_RESULTS/matched-1cpu\""],
  ["bash", "scripts/quiet-slot.sh", "sh", "-c", "DOCKER_CPUS=8 python3 benches/reasoning/maintenance/maintenance.py run --systems nrese --tier lubm-10 --runs 3 --readers 0,1,2,8,64 --duration-s 60 --results \"$QUEUE_RESULTS/8cpu\""],
]
