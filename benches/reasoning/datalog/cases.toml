# The cases of the Datalog kit (datalog.py): a program, the pinned data it runs on, the
# derived counts a right answer has, and the published numbers a contender's configuration
# is checked against before anything is compared.
#
# expected: facts per derived relation, from Soufflé's own runs in the FlowLog
#   reproduction logs (github.com/HarukiMoriarty/FlowLog-Reproduction at 66c88af,
#   log/variant_benchmark/4/souffle_<program>_<dataset>.log); a relation without a
#   published count is cross-checked between the engines.
# published: the FlowLog paper's Table 1 (Zhao et al., VLDB 2026, arXiv 2511.00865v4):
#   seconds at 4 | 64 threads, end to end, Soufflé compiled, on 2 x AMD EPYC 7543 (64 cores),
#   256 GB, 900 s limit.
# home: the contender whose documented strength the case is.
#
# The programs over RDF triples (format = "triples") are GLog's VLDB 2021 package
# (Tsamoura et al., 'Materializing knowledge bases via trigger graphs'; the authors' Google
# Drive folder linked from github.com/karmaresearch/glog): RDFox's benchmark programs in
# VLog's syntax, L (the OWL 2 RL part of each ontology) and LE (L extended with rules that
# make large cliques). Their files state no licence, so they are fetched by hash, not
# committed. `published` there is the authors' own logs in that folder: single-threaded
# `vlog mat` (VLog) and `tgchase --querycont 1 --edbcheck 1` (GLog), seconds and peak MB,
# on their machine; `derived` the total GLog reports (every IDB fact, the pattern-bound
# copies of the input included), which our runs reproduce only where the data is the same.

[source.oxford]
url = "http://krr-nas.cs.ox.ac.uk/2015/ISWC/TestCases/{name}"
what = "RDFox's test data of the ISWC 2015 paper (Nenov et al., 'RDFox: a highly-scalable RDF store'), Information Systems Group, Oxford"
licence = "not stated (catalogue: ask Oxford before publishing results). Fetched, never committed"

[source.lubm]
what = "LUBM(N) from the pinned UBA generator (benches/reasoning/lubm, rvesse/lubm-uba), instance data only"
licence = "generator GPL-2.0; the data is generated"

[source.flowlog]
url = "https://huggingface.co/datasets/NemoYuu/flowlog_benchmark/resolve/main/dataset/csv/{name}.zip"
what = "FlowLog's benchmark datasets (VLDB 2026): graphs from BigDatalog's and RecStep's suites, Graspan's program-analysis graphs, Doop's facts of the DaCapo programs"
licence = "not stated on the dataset; the graphs and Graspan's inputs come from public benchmark suites. Fetched, never committed"

