# Group sparql: the SPARQL stores on their home turf: QLever, Virtuoso, MillenniumDB, Oxigraph, Jena;
# Sparqloscope, BSBM, WatDiv, SP2Bench, WDBench, G-CARE.
# The schema: benches/cases/README.md; validated by benches/suite/suite.py --check.
#
# Each case is a competitor's own benchmark at its published scale: its data (prepared by
# benches/sparql/prepare.sh, frozen in benches/datasets.toml), its queries, its published
# answers where there are any, and each system in its documented best configuration
# (benches/sparql/README.md, "Configurations"). The cases run through the suite's driver
# (`suite.py run --workloads WORKLOAD --tier WORKLOAD=CASE`; a tier is named after its case,
# so that the run's versus entries count it for its home turf), and the answers of every
# system are captured and checked before any time counts.

[[case]]
name = "sparqloscope-dblp"
area = "query"
what = "Sparqloscope on DBLP's knowledge graph (dblp_KG_with_associated_data, release of 11 Oct 2026): 105 queries, one SPARQL feature each; QLever's published geometric mean 0.18 s is the bar"
workload = "sparqloscope"
tier = "sparqloscope-dblp"
levels = ["full"]
semantics = "none"
data = "volume:dblp-kg-20261011.nt"
queries = "@sparqloscope-dblp"
metric = "sum_p50_ms"
expect = { answers = ["jena", "millenniumdb", "virtuoso", "qlever"] }
systems = ["qlever:plain", "virtuoso:plain", "millenniumdb:plain", "jena:plain"]
home_turf = "qlever"
scenario = "native"
needs = ["docker"]
cap_gb = 28
est_min = 600

