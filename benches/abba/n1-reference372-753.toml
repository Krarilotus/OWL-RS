[[case]]
name = "n1-lock-dlmode-lubm1"
area = "dl"
what = "LUBM 1 under owl2-dl: the 14 queries over the bounds, each answer's status (sound, complete) and the path that decided it"
semantics = "owl2-dl"
data = "volume:lubm-1.nt"
extra = ["volume:univ-bench.nt"]
args = ["--reason", "owl2-dl", "--runs", "20"]
queries = "lubm"
metric = "sum_p50_ms"
check = { "q.q01.rows" = 4, "q.q02.rows" = 0, "q.q03.rows" = 6, "q.q04.rows" = 34, "q.q05.rows" = 719, "q.q06.rows" = 7790, "q.q07.rows" = 67, "q.q08.rows" = 7790, "q.q09.rows" = 208, "q.q10.rows" = 4, "q.q11.rows" = 224, "q.q12.rows" = 15, "q.q13.rows" = 1, "q.q14.rows" = 5916, "q.q01.status.complete" = "true", "q.q02.status.complete" = "true", "q.q03.status.complete" = "true", "q.q04.status.complete" = "true", "q.q05.status.complete" = "true", "q.q06.status.complete" = "true", "q.q07.status.complete" = "true", "q.q08.status.complete" = "true", "q.q09.status.complete" = "true", "q.q10.status.complete" = "true", "q.q11.status.complete" = "true", "q.q12.status.complete" = "true", "q.q13.status.complete" = "true", "q.q14.status.complete" = "true" }
route = { "q.q01.status.paths" = "has skolem-only-gap", "q.q02.status.paths" = "has skolem-only-gap", "q.q04.status.paths" = "has skolem-only-gap", "q.q05.status.paths" = "has skolem-only-gap", "q.q07.status.paths" = "has skolem-only-gap", "q.q08.status.paths" = "has skolem-only-gap", "q.q09.status.paths" = "has skolem-only-gap", "q.q10.status.paths" = "has skolem-only-gap", "q.q11.status.paths" = "has skolem-only-gap", "q.q12.status.paths" = "has skolem-only-gap", "q.q03.status.paths" = "has closed-predicates", "q.q06.status.paths" = "has closed-predicates", "q.q13.status.paths" = "has closed-predicates", "q.q14.status.paths" = "has closed-predicates" }
cap_gb = 4
systems = []
guards = ["DL in the store: routing by profile, closed predicates, U1's estimates", "DL in the store: a gap of Skolem constants only costs one evaluation (skolem-only-gap)"]
pinned = "LUBM(1)'s published answers under complete reasoning (expected-lubm-1.tsv); every answer complete, 6 Oct 2026"
repeat = 6
dimensions = [
  "time/q01",
  "time/q02",
  "time/q03",
  "time/q04",
  "time/q05",
  "time/q06",
  "time/q07",
  "time/q08",
  "time/q09",
  "time/q10",
  "time/q11",
  "time/q12",
  "time/q13",
  "time/q14",
  "memory/anon_kernel",
]
min_samples = 1

[[case]]
name = "n1-lock-lks-dlmode-readers"
area = "maintenance"
what = "4,000 commits under owl2-dl with 8 readers: U1's change staged at publish, readers never waiting for its build"
semantics = "owl2-dl"
data = "churn people=20000 changes=2000"
args = [
  "--reason",
  "owl2-dl",
  "--commits",
  "{data}.commits.ru",
  "--readers",
  "8",
]
queries = "churn"
metric = "commits.p50_ms"
check = { "commits.commits" = 4000, "closure_after_commits.equal" = "true" }
route = { "commits.incremental" = "== true" }
cap_gb = 4
systems = []
dimensions = ["time/_", "memory/anon_kernel"]
min_samples = 1

