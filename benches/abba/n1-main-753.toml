# DECLARATION ONLY: H review/adoption, native/input/host/floor checks pending.
# Host is proposed only; GATE_BATCH=0; bind shared profile SHA from manifest.
name = "n1-main-a0-literal"
host = "office-pc"
blocks = 3
[sides]
a = "f9b515e81f013ecd8c3811f3e9c65e91450ee44c"
b = "a0edb6d9740499c0ac3a006d4d4e51f180889465"

[[case]]
name = "n1-lock-rl-sameas"
area = "reasoning"
what = "owl:sameAs chains: 20,000 groups of 10, a value each, spread to the group (equality by representatives, expanded in the stack)"
semantics = "owl2-rl"
data = "sameas groups=20000 size=10"
args = ["--reason", "owl2-rl", "--reason-runs", "16"]
queries = "sameas"
metric = "reason.p50_ms"
check = { "q.values.value" = "expect.values", "q.same-as.value" = "expect.same_as_pairs", "q.knows.value" = "expect.knows", "q.group-values.rows" = 10 }
route = {  }
cap_gb = 6
systems = [
  "nemo:owl2-rl",
  "graphdb:owl2-rl",
  "qlever:rewritten",
  "oxigraph:rewritten",
  "virtuoso:rewritten",
]
guards = ["equality by representatives: facts over each class's smallest id, expanded at read time"]
rewrite = "not-expressible"
dimensions = ["time/_", "memory/anon_kernel"]
min_samples = 1

[[case]]
name = "n1-lock-rl-lubm100"
area = "reasoning"
what = "LUBM 100 (13.4 M asserted, 8.7 M inferred) and its 14 queries: the headline materialisation"
semantics = "owl2-rl"
data = "volume:lubm-100.nt"
extra = ["volume:univ-bench.nt"]
args = ["--reason", "owl2-rl", "--runs", "3"]
queries = "lubm"
metric = "reason.p50_ms"
check = { "reason.inferred" = 8726942, "q.q06.rows" = 1048532, "q.q14.rows" = 795970, "q.q09.rows" = 27247 }
route = { "reason.rounds" = "<= 6" }
cap_gb = 12
systems = [
  "nemo:owl2-rl",
  "jena:owl-horst",
  "graphdb:owl2-rl",
  "qlever:closure",
  "oxigraph:closure",
  "virtuoso:closure",
  "qlever:rewritten",
  "oxigraph:rewritten",
  "virtuoso:rewritten",
]
guards = ["P1-F1 drivers read in place", "P1-F4 no list of derived facts", "P1-F8 candidates deduplicated and probed in order"]
pinned = "NRESE 5 Oct 2026; to equal Nemo's closure plus NRESE's 32 axiomatic statements (fast.py compete)"
dimensions = ["time/_", "memory/anon_kernel"]
min_samples = 1

[[case]]
name = "n1-lock-commits-rdfs"
area = "maintenance"
what = "the same commits under RDFS, without readers"
semantics = "rdfs"
data = "churn people=200000 changes=2000"
args = ["--reason", "rdfs", "--commits", "{data}.commits.ru"]
queries = "churn"
metric = "commits.p50_ms"
check = { "closure_after_commits.equal" = "true", "commits.commits" = 4000 }
route = { "commits.incremental" = "== true" }
cap_gb = 6
systems = ["graphdb:rdfs"]
dimensions = ["time/_", "memory/anon_kernel"]
min_samples = 1

[[case]]
name = "n1-lock-commits-readers"
area = "maintenance"
what = "4,000 one-person commits added then removed under OWL 2 RL, with 8 readers running queries"
semantics = "owl2-rl"
data = "churn people=200000 changes=2000"
args = [
  "--reason",
  "owl2-rl",
  "--commits",
  "{data}.commits.ru",
  "--readers",
  "8",
]
queries = "churn"
metric = "commits.p50_ms"
check = { "closure_after_commits.equal" = "true", "commits.commits" = 4000, "q.students.value" = "200500" }
route = { "commits.incremental" = "== true" }
cap_gb = 6
systems = ["graphdb:owl2-rl"]
dimensions = ["time/_", "memory/anon_kernel"]
min_samples = 1

[[case]]
name = "n1-lock-lks-durable-lubm100"
area = "maintenance"
what = "LUBM 100 loaded and materialised into an on-disk store: the checkpoint and compaction slots the sweep touched"
semantics = "owl2-rl"
data = "volume:lubm-100.nt"
extra = ["volume:univ-bench.nt"]
args = [
  "--store",
  "{scratch}/store",
  "--reason",
  "owl2-rl",
  "--runs",
  "3",
]
queries = "lubm"
metric = "reason.p50_ms"
check = { "reason.inferred" = 8726942, "q.q06.rows" = 1048532 }
cap_gb = 12
systems = []
dimensions = ["time/_", "memory/anon_kernel"]
min_samples = 1

