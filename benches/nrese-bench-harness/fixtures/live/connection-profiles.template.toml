[profiles.secured-live.nrese]
base_url = "${NRESE_LIVE_BASE_URL}"
timeout_ms = 15000

[profiles.secured-live.nrese.headers]
authorization = "Bearer ${NRESE_COMPARE_READ_TOKEN}"

[profiles.secured-live.reference]
# Engine kind (literal, not an env placeholder) decides the endpoint layout: fuseki | graphdb | qlever.
# Optional overrides for deviating versions: query_url, update_url, data_url.
kind = "graphdb"
base_url = "${REFERENCE_LIVE_BASE_URL}"
timeout_ms = 15000

[profiles.secured-live.reference.headers]
# Optional when the reference engine is fronted by the same style of bearer-auth gateway.
# Remove this block if the reference engine only uses the basic_auth block below.
authorization = "Bearer ${REFERENCE_COMPARE_READ_TOKEN}"

#[profiles.secured-live.reference.basic_auth]
#username = "${REFERENCE_BASIC_AUTH_USER}"
#password = "${REFERENCE_BASIC_AUTH_PASS}"

[profiles.secured-live.invocation_profiles.nrese.invalid.headers]
authorization = "Bearer invalid-token"

[profiles.secured-live.invocation_profiles.reference.invalid.headers]
authorization = "Bearer invalid-token"

[profiles.secured-live-timeout.nrese]
base_url = "${NRESE_LIVE_BASE_URL}"
timeout_ms = 500

[profiles.secured-live-timeout.nrese.headers]
authorization = "Bearer ${NRESE_COMPARE_READ_TOKEN}"

[profiles.secured-live-timeout.reference]
kind = "graphdb"
base_url = "${REFERENCE_LIVE_BASE_URL}"
timeout_ms = 500

[profiles.secured-live-timeout.reference.headers]
authorization = "Bearer ${REFERENCE_COMPARE_READ_TOKEN}"

#[profiles.secured-live-timeout.reference.basic_auth]
#username = "${REFERENCE_BASIC_AUTH_USER}"
#password = "${REFERENCE_BASIC_AUTH_PASS}"

[profiles.secured-live-timeout.invocation_profiles.nrese.invalid.headers]
authorization = "Bearer invalid-token"

[profiles.secured-live-timeout.invocation_profiles.reference.invalid.headers]
authorization = "Bearer invalid-token"
