[package]
name = "nrese-bench-harness"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
anyhow = "1.0.100"
nrese-store = { path = "../../crates/nrese-store" }
oxigraph = { version = "0.5.6", default-features = false }
oxrdf = "0.3.3"
# rustls only (no OpenSSL: the binary needs no system TLS library), trusting the bundled
# roots and the machine's CA store (an identity provider with an internal certificate).
reqwest = { version = "0.12.24", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
toml = "0.9.12"

[dev-dependencies]
tempfile = "3.23.0"

# The workspace's patched oxsdatatypes (vendor/oxsdatatypes/NRESE-PATCH.md).
[patch.crates-io]
oxsdatatypes = { path = "../../vendor/oxsdatatypes" }
