# The fast suite's vector cases, timed: three interleaved repetitions in the quiet window.
id = "breadth-vector-timed"
group = "breadth"
host = "office-pc"
checkout = "suite/breadth"
workload = "vector-recall"
window = "quiet"
priority = 2
est_min = 30
needs = ["docker"]
env = { CARGO_BUILD_JOBS = "8", NRESE_MEMORY_CAP_GB = "12", PYTHONIOENCODING = "utf-8", NRESE_QUIET_DRAIN_S = "1800" }
commands = [
  ["python3", "benches/fast/fast.py", "build"],
  ["sh", "-c", "scripts/quiet-slot.sh python3 benches/fast/fast.py run --cases vector-knn-exact,vector-knn-filtered --reps 3 --label breadth-vector --out \"$QUEUE_RESULTS/fast.json\""],
]
