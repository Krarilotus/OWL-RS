# The fast suite's vector cases after the probe-first fix: their recall checks, counts only.
id = "breadth-vector-qualify"
group = "breadth"
host = "office-pc"
checkout = "suite/breadth"
workload = "vector-recall"
window = "any"
priority = 1
est_min = 30
needs = ["docker"]
env = { CARGO_BUILD_JOBS = "8", NRESE_MEMORY_CAP_GB = "12", PYTHONIOENCODING = "utf-8" }
commands = [
  ["python3", "benches/fast/fast.py", "build"],
  ["sh", "-c", "python3 benches/fast/fast.py run --cases vector-knn-exact,vector-knn-filtered --reps 1 --counts-only --label breadth-vector-qualify --out \"$QUEUE_RESULTS/fast.json\""],
]
