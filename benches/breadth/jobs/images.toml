# The breadth benchmarks' images: ERA-SHACL's engines and NRESE's, ann-benchmarks' base,
# NRESE module, Qdrant, pgvector and hnswlib (builds wait for the quiet slot themselves).
id = "breadth-images"
group = "breadth"
host = "office-pc"
checkout = "suite/breadth"
workload = "vector-recall"
window = "any"
priority = 0
est_min = 60
needs = ["docker"]
env = { NRESE_TARGET_VOLUME = "nrese-target-breadth", CARGO_BUILD_JOBS = "8", NRESE_MEMORY_CAP_GB = "12", PYTHONIOENCODING = "utf-8" }
commands = [
  ["python3", "benches/breadth/era-shacl/run.py", "images"],
  ["python3", "benches/breadth/vectors/ann.py", "setup"],
  ["python3", "benches/breadth/vectors/ann.py", "images", "--algorithms", "nrese,qdrant,pgvector,hnswlib"],
]
