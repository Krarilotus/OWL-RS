[package]
name = "oxigraph-comparison"
description = "NRESE's RDF bundle side by side with the Oxigraph crates it replaces: differential tests and throughput benchmarks"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# A workspace of its own: the NRESE workspace stays free of Oxigraph crates.
[workspace]

[dependencies]
nrese-rdf = { path = "../../crates/rdf/nrese-rdf" }
nrese-rdf-io = { path = "../../crates/rdf/nrese-rdf-io" }
nrese-xsd = { path = "../../crates/rdf/nrese-xsd" }
# The released crates, unpatched: the comparison is with Oxigraph as it ships.
oxiri = "=0.2.11"
oxjsonld = "=0.2.4"
oxrdfxml = "=0.2.3"
oxttl = "=0.2.3"
oxrdf = { version = "=0.3.3", features = ["rdfc-10"] }
oxsdatatypes = "=0.2.2"
rand = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
