# BSBM V3.1 at 100 M, Virtuoso's home turf (benches/sparql/README.md), on phuoc-yu under the
# rootfs runtime (owner, 12 Oct 2026). BIBM 0.7.8's driver with the published procedure
# (benches/sparql/bsbm/drive.py): 1, 4, 8 and 64 clients, explore then BI, each system from a
# fresh store. Answers before time: Oxigraph qualifies first, untimed (BSBM_CLIENTS empty:
# drive.py qualifies only); then every system's qualification answers are checked against both
# references' (BSBM_REFERENCES: Virtuoso and Oxigraph), and only answers that agree with both
# are timed. Virtuoso as the V3.1 report's virtuoso.ini sets it (ServerThreads 100,
# ThreadsPerQuery 8, HTTP threads 30) with virtuoso.ini's buffers for 32 GB; NRESE with the same
# 23 GB for queries as in the Sparqloscope job.
# Fair share of the quiet slot (benches/suite/queue.py): one chunk per mix, repetition and
# system (about 25 min), Virtuoso before NRESE in each; the three repetitions in two jobs
# (phuoc-yu takes timed jobs of at most 240 min). Every chunk writes into one batch directory,
# which `suite.py standings` and the run record pool (each chunk a repetition of its own).
# This job: the second and third repetitions, after bsbm-100m-phuoc.toml.
