# Sparqloscope on DBLP's knowledge graph, QLever's home turf (benches/sparql/README.md), on
# phuoc-yu under the rootfs runtime (owner, 12 Oct 2026), every system from its image.
#
# 1. The paper's protocol, to reproduce QLever's published figure here first: every query
#    once in the benchmark's order on a freshly started server with its cache on (the
#    suite's first executions, `repeat` 0), 180 s per query; NRESE likewise.
# 2. The suite's protocol is sparqloscope-dblp-phuoc.toml, after this and the runtime's
#    qualification passed.
# Memory: the paper's configuration for 32 GB scaled to this host's 29 GiB alike for both:
# QLever 23 GB for queries (26 GB there), 5 GB of it cache (6 GB); NRESE 23 GB for queries,
# per query and in all; every process under a 26 GB cap.
id = "sparql-sparqloscope-reproduce-phuoc-1"
group = "sparql"
host = "phuoc-yu"
checkout = "suite/sparql"
commands = [
  ["bash", "scripts/quiet-slot.sh", "python3", "benches/suite/suite.py", "run", "--runtime", "rootfs",
   "--rootfs-dir", "/home/krarilotus/owlrs/rootfs", "--systems", "qlever,nrese", "--workloads", "sparqloscope",
   "--data", "/home/krarilotus/owlrs/sparql-data", "--skip-build", "--runs", "1", "--query-runs", "1",
   "--cache", "on", "--order", "fixed", "--timeout-s", "7200", "--query-timeout-s", "180",
   "--answers", "full", "--answers-reference", "jena,qlever",
   "--results", "/home/krarilotus/owlrs/results/sparql-sparqloscope-dblp-phuoc-1/paper-protocol"],
]
env = { NRESE_QUIET_DRAIN_S = "3600", NRESE_BIN = "/home/krarilotus/owlrs/sparql-bin/1b611e7/nrese-server", HARNESS = "/home/krarilotus/owlrs/sparql-bin/1b611e7/nrese-bench-harness", NRESE_BENCH_SCRATCH = "/home/krarilotus/owlrs/sparql-scratch", DOCKER_MEMORY = "26g", QUERY_MEMORY_MIB = "23552", TOTAL_QUERY_MEMORY_MIB = "23552", QLEVER_MEMORY = "23G", QLEVER_CACHE_MAX_SIZE = "5G", QLEVER_SORT_MEMORY = "10G", QLEVER_SIMULTANEOUS_QUERIES = "1", QLEVER_VOCABULARY_TYPE = "in-memory-compressed", QLEVER_INDEX_SETTINGS = '{"num-triples-per-batch": 1000000}', QLEVER_RUNTIME = "group-by-hash-map-enabled=true" }
needs = []
window = "quiet"
priority = 1
est_min = 90
