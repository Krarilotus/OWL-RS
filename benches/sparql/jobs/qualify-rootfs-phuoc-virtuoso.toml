# Virtuoso alone again (with Jena as the reference) after the bind-source and symlink fixes of the rootfs runtime.
# The rootfs side of the runtime's qualification (qualify-rootfs-docker.toml): WatDiv 10 M on
# every contender and NRESE under the rootfs runtime on phuoc-yu, answers captured, to be
# compared query by query with the Docker run. Inside the quiet slot, so that it never runs
# beside another thread's timing on this host; its own times are not used.
id = "sparql-qualify-rootfs-phuoc-virtuoso-2"
group = "sparql"
host = "phuoc-yu"
checkout = "suite/sparql"
commands = [
  ["bash", "scripts/quiet-slot.sh", "python3", "benches/suite/suite.py", "run", "--runtime", "rootfs",
   "--rootfs-dir", "/home/krarilotus/owlrs/rootfs", "--systems", "virtuoso,jena",
   "--workloads", "watdiv", "--tier", "watdiv=watdiv-10m", "--data", "/home/krarilotus/owlrs/sparql-data", "--skip-build",
   "--runs", "1", "--query-runs", "1", "--cache", "off", "--timeout-s", "3600", "--query-timeout-s", "300",
   "--answers", "full", "--answers-reference", "jena,oxigraph",
   "--results", "/home/krarilotus/owlrs/results/sparql-qualify-rootfs-phuoc-virtuoso-2"],
]
env = { NRESE_QUIET_DRAIN_S = "3600", NRESE_BIN = "/home/krarilotus/owlrs/sparql-bin/1b611e7/nrese-server", HARNESS = "/home/krarilotus/owlrs/sparql-bin/1b611e7/nrese-bench-harness", NRESE_BENCH_SCRATCH = "/home/krarilotus/owlrs/sparql-scratch", DOCKER_MEMORY = "12g", JAVA_HEAP = "8g" }
needs = []
window = "any"
priority = 1
est_min = 20
