# WatDiv's basic testing at 10 M, Oxigraph's and Jena's home turf (benches/sparql/README.md):
# office-pc, at night. Three fresh stores per system, shuffled rounds, three measured runs, the
# result caches off and then on; answers against Jena's, then Oxigraph's.
id = "sparql-watdiv-10m-1"
group = "sparql"
host = "office-pc"
checkout = "suite/sparql"
commands = [
  ["bash", "scripts/quiet-slot.sh", "python3", "benches/suite/suite.py", "run", "--systems", "oxigraph,jena,nrese",
   "--workloads", "watdiv", "--tier", "watdiv=watdiv-10m", "--data", "/home/krarilotus/owlrs/sparql-data", "--skip-build",
   "--runs", "3", "--query-runs", "3", "--cache", "off,on", "--timeout-s", "3600", "--query-timeout-s", "300",
   "--answers", "full", "--answers-reference", "jena,oxigraph",
   "--results", "/home/krarilotus/owlrs/results/sparql-watdiv-10m-1"],
]
env = { NRESE_QUIET_DRAIN_S = "3600", NRESE_TARGET_VOLUME = "/home/krarilotus/owlrs/sparql-bin/1b611e7", HARNESS = "/home/krarilotus/owlrs/sparql-bin/1b611e7/nrese-bench-harness", NRESE_BENCH_SCRATCH = "/home/krarilotus/owlrs/sparql-scratch", DOCKER_MEMORY = "28g", JAVA_HEAP = "24g" }
needs = ["docker"]
window = "quiet"
priority = 3
est_min = 120
