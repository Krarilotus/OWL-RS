# BSBM V3.1 at 100 M, Virtuoso's home turf (benches/sparql/README.md), on phuoc-yu under the
# rootfs runtime (owner, 12 Oct 2026). BIBM 0.7.8's driver with the published procedure
# (benches/sparql/bsbm/drive.py): 1, 4, 8 and 64 clients, explore then BI, each system from a
# fresh store. Answers before time: Oxigraph qualifies first, untimed; then every system's
# qualification answers are checked against both references' (BSBM_REFERENCES: Virtuoso and
# Oxigraph; drive.py), and only answers that agree with both are timed. Virtuoso as the V3.1 report's virtuoso.ini sets it (ServerThreads
# 100, ThreadsPerQuery 8, HTTP threads 30) with virtuoso.ini's buffers for 32 GB; NRESE with
# the same 23 GB for queries as in the Sparqloscope job. The first repetition's Virtuoso line
# is the reproduction of the published figures; the three repetitions are the comparison.
# This job: Virtuoso alone, one repetition: the reproduction, before the comparison
# (bsbm-100m-phuoc.toml).
id = "sparql-bsbm-reproduce-phuoc-2"
group = "sparql"
host = "phuoc-yu"
checkout = "suite/sparql"
commands = [
  # Untimed, outside the quiet slot: Oxigraph's qualification answers, the second reference
  # (BSBM_CLIENTS empty: drive.py qualifies only). Times count only for answers both agree on.
  ["env", "BSBM_CLIENTS=", "python3", "benches/suite/suite.py", "run", "--runtime", "rootfs",
   "--rootfs-dir", "/home/krarilotus/owlrs/rootfs", "--systems", "oxigraph", "--workloads", "bsbm",
   "--tier", "bsbm=bsbm-explore-100m", "--data", "/home/krarilotus/owlrs/sparql-data", "--skip-build",
   "--runs", "1", "--cache", "off", "--timeout-s", "7200", "--query-timeout-s", "300",
   "--answers", "full", "--answers-reference", "virtuoso,oxigraph",
   "--results", "/home/krarilotus/owlrs/results/sparql-bsbm-reproduce-phuoc-2/qualify-explore"],
  ["env", "BSBM_CLIENTS=", "python3", "benches/suite/suite.py", "run", "--runtime", "rootfs",
   "--rootfs-dir", "/home/krarilotus/owlrs/rootfs", "--systems", "oxigraph", "--workloads", "bsbm",
   "--tier", "bsbm=bsbm-bi-100m", "--data", "/home/krarilotus/owlrs/sparql-data", "--skip-build",
   "--runs", "1", "--cache", "off", "--timeout-s", "7200", "--query-timeout-s", "300",
   "--answers", "full", "--answers-reference", "virtuoso,oxigraph",
   "--results", "/home/krarilotus/owlrs/results/sparql-bsbm-reproduce-phuoc-2/qualify-bi"],
  ["bash", "scripts/quiet-slot.sh", "python3", "benches/suite/suite.py", "run", "--runtime", "rootfs",
