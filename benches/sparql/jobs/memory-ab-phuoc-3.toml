# opt/sparql-memory's merge gate at its head: the branch at 05c65958 against e0f84185, its merge base
# with refactor/engine-v2 (main's perf_lab rejects the harness's --routes: every base pass of
# sparql-memory-ab-phuoc-2 failed in 0.0 s and the job still finished done). Both built by
# the queue on office-pc for x86-64-v3 (e0f84185 into sparql-bin/e0f84185-office/), natively on phuoc-yu.
# Per group: q-counts (3 repetitions), the fast suite's query cases and its operator cases
# (2 each), A then B then B then A; compared with fast.py compare.
# Each chunk fails as fast.py does: a failed, wrong or missing run fails it, and a run of no
# case; on the base side (--off-route-ok) a case off its expected route is a measured run
# (the base hasn't the counted join or the range count), on the branch's side it fails.
# Since sparql-memory-ab-phuoc-2 (the branch at ce3e697e): a COUNT of a variable only an
# OPTIONAL binds is counted, a cache hit is charged before its copy, and op-group expects
# the counted join for untitled (the route was outdated: the same answers, 19.4 -> 5.5 ms).
# NRESE_QUIET_SLOT=0: the outer slot and the runner's watcher keep the host quiet.
