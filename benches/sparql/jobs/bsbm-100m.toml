# BSBM V3.1 at 100 M, Virtuoso's home turf (benches/sparql/README.md): office-pc, at night.
#
# BIBM 0.7.8's driver with the published procedure (benches/sparql/bsbm/drive.py): 1, 4, 8
# and 64 clients, explore then BI, each system from a fresh store. Virtuoso runs first in
# every repetition (the suite's order), so its qualification answers are the reference NRESE's
# are compared with (BSBM_REFERENCES); Virtuoso as the V3.1 report configures it for 32 GB.
# Three repetitions per pair; the result caches off, then on.
id = "sparql-bsbm-100m-1"
group = "sparql"
host = "office-pc"
checkout = "suite/sparql"
commands = [
  ["bash", "scripts/quiet-slot.sh", "python3", "benches/suite/suite.py", "run", "--systems", "virtuoso,nrese", "--workloads", "bsbm",
   "--tier", "bsbm=bsbm-explore-100m", "--data", "/home/krarilotus/owlrs/sparql-data", "--skip-build",
   "--runs", "3", "--cache", "off,on", "--timeout-s", "7200", "--query-timeout-s", "300",
   "--answers", "full", "--answers-reference", "virtuoso",
   "--results", "/home/krarilotus/owlrs/results/sparql-bsbm-100m-1/explore"],
  ["bash", "scripts/quiet-slot.sh", "python3", "benches/suite/suite.py", "run", "--systems", "virtuoso,nrese", "--workloads", "bsbm",
   "--tier", "bsbm=bsbm-bi-100m", "--data", "/home/krarilotus/owlrs/sparql-data", "--skip-build",
   "--runs", "3", "--cache", "off,on", "--timeout-s", "7200", "--query-timeout-s", "300",
   "--answers", "full", "--answers-reference", "virtuoso",
   "--results", "/home/krarilotus/owlrs/results/sparql-bsbm-100m-1/bi"],
]
env = { NRESE_QUIET_DRAIN_S = "3600", SPARQL_DATA = "/home/krarilotus/owlrs/sparql-data", BSBM_REFERENCES = "virtuoso", NRESE_TARGET_VOLUME = "/home/krarilotus/owlrs/sparql-bin/1b611e7", HARNESS = "/home/krarilotus/owlrs/sparql-bin/1b611e7/nrese-bench-harness", NRESE_BENCH_SCRATCH = "/home/krarilotus/owlrs/sparql-scratch", DOCKER_MEMORY = "28g", QUERY_MEMORY_MIB = "26624", TOTAL_QUERY_MEMORY_MIB = "26624", VIRTUOSO_NUMBER_OF_BUFFERS = "2720000", VIRTUOSO_MAX_DIRTY_BUFFERS = "2000000", VIRTUOSO_SERVER_THREADS = "100", VIRTUOSO_THREADS_PER_QUERY = "8", VIRTUOSO_HTTP_THREADS = "30" }
needs = ["docker", "java"]
window = "quiet"
priority = 2
est_min = 240
