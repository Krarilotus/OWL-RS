# The benchmark hosts: their roles, what they have, and the verified shared inputs
# (benches/README.md#hosts). The one owner of host facts; drivers read it through
# benches/suite/suitekit/hosts.py. An environment variable named beside an input
# overrides it for one run; ~/.config/nrese-bench.env holds only what changes per campaign
# (the binaries under test, the results directory).
#
# Roles: build (compiles Rust, runs the gate and build-triggering hooks), test (runs the
# test suites), measure (runs timed benchmarks), prepare (downloads, data preparation, answer
# checks: no timing), cluster (runs the suite under SLURM).
# has: what cases may need (docker, java, apptainer); a driver refuses a case whose
# needs the host lacks.
# config: the host's configurations, newest first, each from `since` (the host's local
# time): what changes timings (toolchain, CPU governor, profiling, page-cache control).
# compare refuses to set two runs of different configurations side by side
# (suitekit/compare.py); a run's configuration is the one in force when it started.
# queue: the host's measurement queue (benches/suite/queue.py): its directory, and when a
# timed job may start: within `windows` (local time) or while the `free` file exists, never
# while the `retreat` file exists (the owners are present) and never while a compiler runs.
# `timing = false`: the host takes no timed job at all (window "quiet"); `keep = "same-day"`:
# a job's results are fetched the day it ends (queue.py fetch) and removed there.
# Fair share: a timed job runs one chunk (an entry of its commands) of about `chunk_min`
# minutes (default 30) per turn, then the next turn goes to another group first; a chunk past
# 1.5 times it is stopped. `max_job_min`: no timed job longer than that here (day-long series
# go to khaleesi or office-pc at night).

[assets]
# Immutable preservation copies, SHA-256-verified on office-pc and phuoc-yu (receipts in
# manifests/). Read-only: never a data, build, scratch or cleanup target. Verify a snapshot
# against its receipt before using it; a matching name is not a matching content.
root = "/home/krarilotus/nrese-assets/kraris-gptler-20261009"
# Earlier campaigns' results, binaries and evidence, kept where run records point.
evidence = "/home/krarilotus/nrese-prep-20261009-4e8bd38"
# The benchmark images loaded from inputs.images under verified aliases (nrese-preserved/*):
# each alias with its original tags and image ID. A driver asking for an original tag that
# Docker lacks gets the alias whose ID matches (suitekit/hosts.py image()).
images = "manifests/image-load-verification.json"

[inputs]
# Paths under assets.root (or an entry's own `root`), on every host with assets = true; the
# variable overrides.
data = { path = "snapshots/windows/nrese-data", env = "BENCH_DATA", what = "the suite's datasets (suite.py run --data)" }
general = { path = "snapshots/docker-volumes/nrese-bench-data", env = "BENCH_GENERAL_DATA", what = "the general Docker data volume's contents" }
fast = { path = "snapshots/docker-volumes/nrese-fast-data", env = "NRESE_FAST_INPUTS", what = "the fast suite's converted ORE ontologies (ore/) and reference taxonomies (ref/)" }
ore = { path = "snapshots/windows/original-cache-ore2015/pool_sample/files", env = "NRESE_ORE_DIR", what = "ORE 2015 ontologies (CC BY-NC-ND, never committed)" }
ore_archive = { path = "snapshots/windows/original-cache-ore2015/ore2015_sample.zip", env = "BENCH_ORE_ARCHIVE", what = "the ORE 2015 sample as published (Zenodo 18578)" }
licences = { path = "snapshots/windows/nrese-bench/licenses", env = "NRESE_LICENSES", what = "licence files of restricted systems (never committed)" }
fuseki = { path = "snapshots/windows/original-cache-tools/apache-jena-fuseki-6.0.0", env = "FUSEKI_HOME", what = "Apache Jena Fuseki for the Jena oracle" }
images = { path = "images/nrese-bench-source-tags.docker.tar", env = "", what = "the benchmark images; loaded on office-pc as nrese-preserved/*" }
# A set of its own beside the preserved one: `root` names it, `path` is under it. Read-only,
# its receipt (SHA256SUMS) and manifest at its root; made by benches/property-graphs (README.md).
snb = { root = "/home/krarilotus/nrese-assets/ldbc-snb-20261030", path = ".", env = "SNB_ASSETS", what = "LDBC SNB Interactive v2 initial data sets, SF1 and SF3: the published CSV and its RDF 1.2 mappings (variants A and B)" }

[volumes]
# The Docker volumes the drivers use on a host with Docker; the variable names another for a
# run (a campaign's own copy). Both are working copies, never the preserved inputs.
data = { name = "nrese-bench-data", env = "NRESE_BENCH_VOLUME", what = "the datasets (/data), prepared by the kits; runs mount it read-only" }
fast = { name = "nrese-fast-data", env = "NRESE_FAST_VOLUME", what = "the fast suite's generated data, converted ontologies and reference taxonomies (/fast)" }

