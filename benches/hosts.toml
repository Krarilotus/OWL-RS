# The benchmark hosts: their roles, what they have, and the verified shared inputs
# (benches/README.md#hosts). The one owner of host facts; drivers read it through
# benches/suite/suitekit/hosts.py. An environment variable named beside an input
# overrides it for one run; ~/.config/nrese-bench.env holds only what changes per campaign
# (the binaries under test, the results directory).
#
# Roles: build (compiles Rust, runs the gate and build-triggering hooks), test (runs the
# test suites), measure (runs benchmarks), cluster (runs the suite under SLURM).
# has: what cases may need (docker, java, apptainer); a driver refuses a case whose
# needs the host lacks.

[assets]
# Immutable preservation copies, SHA-256-verified on office-pc and phuoc-yu (receipts in
# manifests/). Read-only: never a data, build, scratch or cleanup target. Verify a snapshot
# against its receipt before using it; a matching name is not a matching content.
root = "/home/krarilotus/nrese-assets/kraris-gptler-20261009"
# Earlier campaigns' results, binaries and evidence, kept where run records point.
evidence = "/home/krarilotus/nrese-prep-20261009-4e8bd38"

[inputs]
# Paths under assets.root, on every host with assets = true; the variable overrides.
data = { path = "snapshots/windows/nrese-data", env = "BENCH_DATA", what = "the suite's datasets (suite.py run --data)" }
general = { path = "snapshots/docker-volumes/nrese-bench-data", env = "BENCH_GENERAL_DATA", what = "the general Docker data volume's contents" }
fast = { path = "snapshots/docker-volumes/nrese-fast-data", env = "NRESE_FAST_INPUTS", what = "the fast suite's converted ORE ontologies (ore/) and reference taxonomies (ref/)" }
ore = { path = "snapshots/windows/original-cache-ore2015/pool_sample/files", env = "NRESE_ORE_DIR", what = "ORE 2015 ontologies (CC BY-NC-ND, never committed)" }
ore_archive = { path = "snapshots/windows/original-cache-ore2015/ore2015_sample.zip", env = "BENCH_ORE_ARCHIVE", what = "the ORE 2015 sample as published (Zenodo 18578)" }
licences = { path = "snapshots/windows/nrese-bench/licenses", env = "NRESE_LICENSES", what = "licence files of restricted systems (never committed)" }
fuseki = { path = "snapshots/windows/original-cache-tools/apache-jena-fuseki-6.0.0", env = "FUSEKI_HOME", what = "Apache Jena Fuseki for the Jena oracle" }
images = { path = "images/nrese-bench-source-tags.docker.tar", env = "", what = "the benchmark images; loaded on office-pc as nrese-preserved/*" }

[host.office-pc]
ssh = "Office-PC"
hostname = "sus-ai"
os = "linux"
machine = "AMD Ryzen 9 5950X, 32 threads, 31 GiB"
roles = ["build", "test", "measure"]
has = ["docker", "java"]
assets = true

[host.phuoc-yu]
ssh = "Phuoc-Yu"
hostname = "Phuoc-Yu"
os = "linux"
machine = "AMD Ryzen 7 7800X3D, 16 threads, 29 GiB"
roles = ["measure"]
has = []
assets = true
binaries = "office-pc builds; record the source revision and binary SHA-256 and check CPU features and glibc symbols before use"

[host.khaleesi]
ssh = "Khaleesi"
os = "windows"
roles = ["measure"]
has = []
assets = false

[host.gamergrill]
ssh = "GamerGrill"
os = "windows"
roles = ["measure"]
has = []
assets = false

[host.draco]
os = "linux"
roles = ["cluster"]
has = ["apptainer"]
assets = false
runtime = "apptainer"
