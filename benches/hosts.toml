# What OWL-RS's bench drivers read about a host (benches/suite/suitekit/hosts.py), and what its
# jobs keep there. Which host takes a job, its roles, capacity, windows and rules are the
# fleet's (`fleet rules`, `fleet why ID`): never restated here. An environment variable named
# beside an input overrides it for one run.
#
# This file holds what is true on any machine. The hosts themselves are private: when
# NRESE_BENCH_PRIVATE names an overlay folder. BENCH_INPUTS_GIT selects the inputs checkout's
# committed overlay when no folder is given. Its hosts.toml is merged over this one, table by
# table (a key in both takes the overlay's value). Without one no host is registered: a driver
# finds the verified inputs only by their variables, refuses a case nothing, and compare gives a
# run's configuration as "-".
#
# [inputs]: the verified preserved inputs, read-only, each by its variable; the overlay gives
# their paths under its [assets] root, on the hosts with `assets = true`.
# [volumes], [caches]: what the jobs keep on a host (their location, size and lifetime).
# [sources]: inputs a job takes as a git input.
# The overlay's [host.NAME]: `hostname`/`ssh` (how a driver knows where it runs), `assets`, `has`
# (docker, java: a case's needs the driver checks), `cpus`, and `config`, the host's
# configurations, newest first, each from `since` (local time): what changes timings (toolchain,
# CPU governor, profiling, page-cache control). compare refuses to set runs of two configurations
# side by side (suitekit/compare.py), or of two overlays (a run records the overlay content digest).
# The overlay's [fleet]: lists of host keys OWL-RS's own scripts choose among the fleet's hosts,
# each read by the script its comment names (hosts.py fleet NAME). An explicit [] permits an empty
# policy; admission stops when the source or requested list is absent.
# A fleet job reads the overlay on its host from its environment: the job writers, on the machine
# that has the overlay, put its hosts.toml in NRESE_BENCH_HOSTS, its A-A' noise floors in
# NRESE_BENCH_FLOORS, and the digest of both in NRESE_BENCH_OVERLAY_REV (hosts.py overlay_env).
# All three channels come from one source.

[inputs]
data = { env = "BENCH_DATA", what = "the suite's datasets (suite.py run --data)" }
general = { env = "BENCH_GENERAL_DATA", what = "the general Docker data volume's contents" }
fast = { env = "NRESE_FAST_INPUTS", what = "the fast suite's converted ORE ontologies (ore/) and reference taxonomies (ref/)" }
ore = { env = "NRESE_ORE_DIR", what = "ORE 2015 ontologies (CC BY-NC-ND, never committed)" }
ore_archive = { env = "BENCH_ORE_ARCHIVE", what = "the ORE 2015 sample as published (Zenodo 18578)" }
licences = { env = "NRESE_LICENSES", what = "licence files of restricted systems (never committed)" }
fuseki = { env = "FUSEKI_HOME", what = "Apache Jena Fuseki for the Jena oracle" }
images = { env = "", what = "the benchmark images; loaded on a host that holds the inputs as nrese-preserved/*" }

[volumes]
# The Docker volumes the drivers use on a host with Docker; the variable names another for a
# run (a campaign's own copy). Both are working copies, never the preserved inputs.
data = { name = "nrese-bench-data", env = "NRESE_BENCH_VOLUME", what = "the datasets (/data), prepared by the kits; runs mount it read-only" }
fast = { name = "nrese-fast-data", env = "NRESE_FAST_VOLUME", what = "the fast suite's generated data, converted ontologies and reference taxonomies (/fast)" }

[caches]
# What OWL-RS's jobs keep on a fleet host between jobs: its location, its size at most, and its
# lifetime, declared so the fleet can account for it; its contents are the jobs' (the maintainer,
# 2 Nov 2026: "Data is the job's responsibility, not the fleet's"). A job makes what it lacks
# (release_gate.py data --make, in release-gate.sh prepare) and asks for the disk to make it in.
sparql-data = { path = "~/owlrs/sparql-data", env = "SPARQL_DATA", max_gb = 400, what = "the host's made datasets: the SPARQL workloads' as benches/sparql/prepare.sh makes them (12 frozen files, 196 GB in benches/datasets.toml), their sources (src/) and the pinned query sets (queries/; WatDiv's can't be made again, only copied); and since 7 Nov 2026 what a timing job makes where the host lacks it (release_gate.py DATASET_MAKERS: LUBM, OWL2Bench, support-stress; about 2.7 GB for the LUBM and OWL2Bench files the reasoning cases read, 0.18 GB for support-stress's 48), each checked against its pin before it is kept", lifetime = "kept while benches/datasets.toml freezes the file; a file whose freeze changed, and src/ after its file is made, may go; scripts/bench-cleanup.sh never removes a frozen file" }
gate-bin = { path = "~/owlrs/gate-v2-bin", env = "GATE_BIN", max_gb = "not measured yet", what = "the gate's and A-B-B-A's builds by identity (release-gate.sh build), shared by every gate on the host", lifetime = "a build no gate used for GATE_BIN_AGE_DAYS goes (release-gate.sh clean)" }

[sources]
# Inputs a job takes as a git input (nothing a host must hold): `git`, their repository on the
# machine that writes the jobs (the overlay gives it), which the variable overrides. A fleet job
# never fetches it from a remote: the fleet pushes the job's commit from that repository into
# the host's own, so hosts need no access to one. Private, never public.
bench-inputs = { env = "BENCH_INPUTS_GIT", input = "BENCH_INPUTS", what = "the pinned query sets that can't be made again or committed here (WatDiv's: a clock-seeded generator, no licence stated), byte for byte as benches/sparql/queries.sha256 pins them, under queries/" }
