# What OWL-RS's bench drivers read about a host (benches/suite/suitekit/hosts.py), and what its
# jobs keep there. Which host takes a job, its roles, capacity, windows and rules are the
# fleet's (`fleet rules`, `fleet why ID`): never restated here. An environment variable named
# beside an input overrides it for one run.
#
# [assets], [inputs]: the verified preserved inputs, read-only, on the hosts with `assets = true`.
# [volumes], [caches]: what the jobs keep on a host (their location, size and lifetime).
# [host.NAME]: `hostname`/`ssh` (how a driver knows where it runs), `assets`, `has` (docker,
# java: a case's needs the driver checks), `cpus`, and `config`, the host's configurations,
# newest first, each from `since` (local time): what changes timings (toolchain, CPU governor,
# profiling, page-cache control). compare refuses to set runs of two configurations side by
# side (suitekit/compare.py).
# `roles` and `queue` are read only by benches/suite/queue.py, scripts/capped-chunk.py and
# scripts/hosts/khaleesi-guard.py, the queue that came before the fleet; they go with them.

[assets]
# Immutable preservation copies, SHA-256-verified on office-pc and phuoc-yu (receipts in
# manifests/). Read-only: never a data, build, scratch or cleanup target. Verify a snapshot
# against its receipt before using it; a matching name is not a matching content.
root = "/home/krarilotus/nrese-assets/kraris-gptler-20261009"
# Earlier campaigns' results, binaries and evidence, kept where run records point.
evidence = "/home/krarilotus/nrese-prep-20261009-4e8bd38"
# The benchmark images loaded from inputs.images under verified aliases (nrese-preserved/*):
# each alias with its original tags and image ID. A driver asking for an original tag that
# Docker lacks gets the alias whose ID matches (suitekit/hosts.py image()).
images = "manifests/image-load-verification.json"

[inputs]
# Paths under assets.root, on every host with assets = true; the variable overrides.
data = { path = "snapshots/windows/nrese-data", env = "BENCH_DATA", what = "the suite's datasets (suite.py run --data)" }
general = { path = "snapshots/docker-volumes/nrese-bench-data", env = "BENCH_GENERAL_DATA", what = "the general Docker data volume's contents" }
fast = { path = "snapshots/docker-volumes/nrese-fast-data", env = "NRESE_FAST_INPUTS", what = "the fast suite's converted ORE ontologies (ore/) and reference taxonomies (ref/)" }
ore = { path = "snapshots/windows/original-cache-ore2015/pool_sample/files", env = "NRESE_ORE_DIR", what = "ORE 2015 ontologies (CC BY-NC-ND, never committed)" }
ore_archive = { path = "snapshots/windows/original-cache-ore2015/ore2015_sample.zip", env = "BENCH_ORE_ARCHIVE", what = "the ORE 2015 sample as published (Zenodo 18578)" }
licences = { path = "snapshots/windows/nrese-bench/licenses", env = "NRESE_LICENSES", what = "licence files of restricted systems (never committed)" }
fuseki = { path = "snapshots/windows/original-cache-tools/apache-jena-fuseki-6.0.0", env = "FUSEKI_HOME", what = "Apache Jena Fuseki for the Jena oracle" }
images = { path = "images/nrese-bench-source-tags.docker.tar", env = "", what = "the benchmark images; loaded on office-pc as nrese-preserved/*" }

[volumes]
# The Docker volumes the drivers use on a host with Docker; the variable names another for a
# run (a campaign's own copy). Both are working copies, never the preserved inputs.
data = { name = "nrese-bench-data", env = "NRESE_BENCH_VOLUME", what = "the datasets (/data), prepared by the kits; runs mount it read-only" }
fast = { name = "nrese-fast-data", env = "NRESE_FAST_VOLUME", what = "the fast suite's generated data, converted ontologies and reference taxonomies (/fast)" }

[caches]
# What OWL-RS's jobs keep on a fleet host between jobs: its location, its size at most, and its
# lifetime, declared so the fleet can account for it; its contents are the jobs' (Johannes, 2 Nov
# 2026: "Data is the job's responsibility, not the fleet's"). A job makes what it lacks
# (release_gate.py data --make, in release-gate.sh prepare) and asks for the disk to make it in.
sparql-data = { path = "~/owlrs/sparql-data", env = "SPARQL_DATA", max_gb = 400, what = "the SPARQL workloads' datasets as benches/sparql/prepare.sh makes them (12 frozen files, 196 GB in benches/datasets.toml), their sources (src/) and the pinned query sets (queries/; WatDiv's can't be made again, only copied)", lifetime = "kept while benches/datasets.toml freezes the file; a file whose freeze changed, and src/ after its file is made, may go; scripts/bench-cleanup.sh never removes a frozen file" }
gate-bin = { path = "~/owlrs/gate-v2-bin", env = "GATE_BIN", max_gb = "not measured yet", what = "the gate's and A-B-B-A's builds by identity (release-gate.sh build), shared by every gate on the host", lifetime = "a build no gate used for GATE_BIN_AGE_DAYS goes (release-gate.sh clean)" }

[sources]
# Inputs a job takes as a git input (nothing a host must hold): `git`, their repository on the
# main PC, which the variable overrides; `remote`, its backup. A fleet job never fetches from the
# remote: the fleet pushes the job's commit from the main PC's repository into the host's own
# (fleet-scheduler act.rs push_git), so hosts need no access to it. Private, never public.
bench-inputs = { git = "C:/Users/Johannes/Documents/owlrs-bench-inputs", remote = "git@github.com:Krarilotus/owlrs-bench-inputs.git", env = "BENCH_INPUTS_GIT", input = "BENCH_INPUTS", what = "the pinned query sets that can't be made again or committed here (WatDiv's: a clock-seeded generator, no licence stated), byte for byte as benches/sparql/queries.sha256 pins them, under queries/" }

