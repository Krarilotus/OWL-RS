  "Acceptance passes: no regression in time or space, answers identical (fast.py compare: 0 regressions, from the full and from the compact reports alike).",
  "Answers identical: 3,720 facts (statuses, every check's value, each query's rows and values, every work counter) equal on both sides; five vary within each side by timing alone (dl-transitive-400's counters where it gives up, dlmode-reject-dl's message with its milliseconds, rdf12-annotations' index bytes after a parallel load, vector-knn-filtered's recall).",
  "Time: no case slower or faster beyond its threshold; 86 timed cases, median spread 2 %. Intervals excluding 1 but inside the threshold: clients-sweep 0.92x, writes-under-readers 0.85x (below the floor), q-large-result, ql-owl2bench and dl-nominals 0.96x, load-threads 1.02x, op-dates 1.02x.",
  "Throughput: clients-sweep 1.01-1.04x at every width (1 to 64 clients), within noise.",
  "Space: no cgroup peak grew beyond +10 % and +64 MiB. classify-store-horn's process peak (VmHWM) is bimodal: base 273/289/530/625 MiB, pr23 605/637/666/841 MiB, its cgroup peak 3,444 -> 3,430 MiB (page cache dominates it); a watch item, not a regression.",
  "Known issues unchanged: mem-load-20m-2g needs 5.1 GiB past its 2 GiB cap on both sides (median of 4 runs at 8 GB), dl-transitive-400 gives up at 300 s too, vector-knn-filtered's recall 0.40-0.60 against a 0.9 gate.",
  "compare first read only one run past a limit per side and flagged mem-load-20m-2g's (4,032 -> 5,201 MiB, base's first run an outlier); it now takes the medians of all of them.",
  "Host configuration: phuoc-yu as configured since 2026-10-09 (Zig cc wrappers, powersave governor; hosts.toml config). Phuoc-Yu changed at 13:00 (gcc 15.2, performance governor): these timings don't compare with runs from then on.",
  "rl-hierarchy's 54 % spread is base's first pass (2,668 ms, while its data was copied in); the other seven passes 1,729-1,846 ms.",
]
