findings = [
  "The fast suite took the container's memory.peak as the case's peak; it counts the page cache charged to the container's reads, so the input's cache state decided 0 to 2.3 GB of rl-lubm100's peak. The process's peak was 2.0-2.1 GB in every office run.",
  "perf_lab's per-phase resets of the kernel's high-water mark (clear_refs) also reset ru_maxrss: its report's peak_mib and time -v's maximum resident set were the last window's alone. For classify-store-horn the last window opened after the classification, so the acceptance A/B's process peak (273-841 MiB) was the memory left after it, and its 3.4 GiB container peak the process's real one.",
  "The remaining spread of the process's peak is mimalloc's: a freed large block stays resident 100 ms (purge_delay 10 ms times arena_purge_mult 10), about a materialisation round, so whether a round's freed buffers count in the next round's peak depends on timing. It stays under the performance governor (baseline 2,041-2,148 MiB).",
  "rdf12-annotations' swing (container 1,033-1,543 MiB, process 971-984) was the page cache alone; small parallel loads vary in the process too: up to 32 % (commits-rdfs 346-456 MiB), the reason compare's bound is 40 %.",
  "The PR #23 acceptance A/B on phuoc-yu (driver 15a18ff, v2-bench-ab) recorded the scope's memory.peak as the case's peak, so its memory verdicts carry the page cache.",
]
