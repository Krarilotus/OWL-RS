findings = [
  "The fast suite took the container's memory.peak as the case's peak; it counts the page cache charged to the container's reads, so the input's cache state decided 0 to 2.3 GB of rl-lubm100's peak. The process's peak was 2.0-2.1 GB in every run.",
  "perf_lab's per-phase resets of the kernel's high-water mark (clear_refs) also reset ru_maxrss: its report's peak_mib and time -v's maximum resident set were the last phase's alone (1,111 MiB for a process that peaked at 1,864).",
  "The remaining spread of the process's peak is mimalloc's: a freed large block stays resident 100 ms (purge_delay 10 ms times arena_purge_mult 10), about a materialisation round, so whether a round's freed buffers count in the next round's peak depends on timing. It is there on a quiet host too (baseline 1,878-2,165 MiB) and grows with threads and host load.",
  "rdf12-annotations' swing (container 1,033-1,543 MiB, process 971-984) was the page cache alone; kernel-intersect and commits-rdfs vary in the process too (office, 32 threads: 743-916 and 494-602 MiB).",
  "The PR #23 A/B running on phuoc-yu at the same time (driver 15a18ff, v2-bench-ab) records the scope's memory.peak as the case's peak, so its memory verdicts carry the page cache too.",
]
