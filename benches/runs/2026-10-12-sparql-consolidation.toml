id = "2026-10-12-sparql-consolidation"
kit = "fast"
purpose = "PR #23 SPARQL/exec consolidation: the base comparison of the cases the 11 Oct A/B flagged (open-first-query +12 %, kernel-intersect and op-negation memory), and whether the generic evaluate path through SolutionTable caused them"
baseline = "157931a (v2 before the PR); the PR head 111d47d (snapshot a57e11c) as a third arm for open-first-query"
findings = "open-first-query: the PR's first query is slower again here (+11.4 % cold median over 80 runs), the consolidated branch is within the base's interquartile range (+1.1 %). The case writes through the direct writer, so the typed SolutionTable path was not on it. Counts: whole-process user instructions equal within 1 % in all three (perf stat, 15 runs each, twice), syscalls equal (486/488/488, 5 thread clones each, no pool start); page faults base 319-326, PR 335-337, consolidated 322-334, first-query faults base 43-45, PR 47-50: the PR's extra time is first-touch faults, not extra work. op-negation and kernel-intersect: equal query times; their memory differences sit in the load phase, which varies as much between base runs (kernel-intersect load peak 826-916 MiB in the base alone); query-phase peaks equal within that noise. Screen of 17 cases on the touched paths (direct output, CONSTRUCT, paths, aggregates, client lookups, vector search, QL, DL bounds, result cache), two interleaved pairs: no case slower beyond the 10 % floor in either pair; ratios 0.90-1.07, q-star once faster (0.90). 32-client lookup QPS equal (base 960k/966k, consolidated 981k/965k). vector-knn-filtered fails its recall check in both arms (approximate recall 0.40-0.54, the known open failure), so it has no timing verdict; its times are not slower."
host = "Office-PC"
