  "Serving memory: the suite's +60-120% was mostly docker stats' 1 Hz sampling; sampled at 10 Hz natively it was +18% (cache off), from the planner statistics' scan of the store at the first query after every start (2.9 s CPU, +75-100 MiB per fresh server on LUBM 100). Fixed in 6b7fcae: built in parallel at load (0.32 s), saved beside the checkpoint, read at start; the LUBM 100 mix peak is now 492 MiB against 535 on 2 October",
  "dbpedia-core q12-goals-per-team 26 -> 87 ms: the eager-aggregation rewrite grouped career stations that have one goal count each (1,065,056 rows into 1,065,031 groups). Fixed in d8f26ae: the rewrite applies only where the statistics estimate two or more rows per key; q12 back to 24.5 ms in the engine",
