# The fast suite's cases (benches/fast/README.md): one bottleneck or use case each,
# 10-300 s, generated data or a pinned file, checked before its time counts.
#
# name       the case
# area       reasoning, maintenance, dl, memory, load, query, operator, service
# what       what it measures, in a line
# semantics  what NRESE computes: none, rdfs, rdfs-full, rdfs-plus, owl-horst, owl2-ql,
#            owl2-rl, custom (N3 rules), el, dl, canonical
# data       `KIND key=value ...` for `perf_lab generate`, or `volume:FILE` from the dataset
#            volume nrese-bench-data
# tool       perf_lab (default); tableau (nrese-dl's tableau_consistency), classify-el
#            (nrese-reasoner's classify), classify-horn (nrese-dl's context_classify)
# args       further arguments for the tool; {data} is the generated file
# queries    a directory under queries/, or `lubm` / `owl2bench` (the reasoning kit's)
# metric     the number the case is timed by (a path in the result, below)
# check      path = value: must hold before the time counts. A value `expect.KEY` is the
#            generator's own answer; a number or string is pinned (with `pinned`)
# route      path = "OP VALUE": the plan or engine path the case must take (OP: ==, <=,
#            >=, has, lacks)
# cap_gb     the container's memory cap (no swap)
# outcome    what the run is expected to end as: ok (default) or a known limit
#            (`memory-limit`): tracked, not failed
# systems    the comparators, `system:semantics`, each run only where it supports that
#            semantics (fast.py compete): plain = the same SPARQL on the same data;
#            closure = the same queries on NRESE's exported closure (stores without
#            reasoning); rdfs, owl-horst, owl2-rl, custom, el, dl = the system's own
#            reasoner under that semantics. Empty: NRESE only (its own column).
# home_turf  the competitor whose documented strength the case is (CATALOG.md §6)
# guards     the wins of docs/design/performance.md §0 the case measures
#
# Paths in a result: reason.inferred, reason.rounds, reason.p50_ms, commits.p50_ms,
# commits.incremental, closure_after_commits.equal, loaded, load_s, shacl.results,
# clients.qps, canonicalize.equal, q.QUERY.rows, q.QUERY.value, q.QUERY.operators, sum_p50_ms,
# peak_mib, cgroup_peak_mib; for the DL tools: answer, whole_ms and the telemetry's
# counters (branch_points, clauses, nodes_created, data_checks, ...), hash.

# --- rule reasoning: one shape per case, every ruleset ----------------------------------------

[[case]]
name = "rl-hierarchy"
area = "reasoning"
what = "a 5,461-class tree and a 1,500-class spine over 1 M typed instances (inherited types)"
semantics = "owl2-rl"
data = "hierarchy fan=4 depth=7 spine=1500 instances=1000000"
args = ["--reason", "owl2-rl", "--reason-runs", "3"]
queries = "hierarchy"
metric = "reason.p50_ms"
check = { "q.root.value" = "expect.instances_of_root", "q.spine-middle.value" = "expect.instances_of_spine_middle", "q.h1.value" = "expect.instances_of_h1" }
route = { "reason.rounds" = "<= 3" }
cap_gb = 8
systems = ["nemo:owl2-rl", "graphdb:owl2-rl", "rdfox:owl2-rl", "qlever:closure", "oxigraph:closure"]
guards = ["schema compiled first: sup⁺(c) dispatch, hierarchy module by SCC and bitsets"]

[[case]]
name = "rdfs-hierarchy"
area = "reasoning"
what = "the same hierarchy under RDFS"
semantics = "rdfs"
data = "hierarchy fan=4 depth=7 spine=1500 instances=1000000"
args = ["--reason", "rdfs", "--reason-runs", "3"]
queries = "hierarchy"
metric = "reason.p50_ms"
check = { "q.root.value" = "expect.instances_of_root", "q.spine-middle.value" = "expect.instances_of_spine_middle", "q.h1.value" = "expect.instances_of_h1" }
route = { "reason.rounds" = "<= 3" }
cap_gb = 8
systems = ["jena:rdfs", "rdf4j:rdfs", "graphdb:rdfs", "rdfox:rdfs"]

[[case]]
