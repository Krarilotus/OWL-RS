queries = "clique"
metric = "reason.p50_ms"
check = { "q.pairs.value" = "expect.pairs", "q.one-component.value" = "300" }
route = { "reason.rounds" = "<= 3" }
cap_gb = 6
systems = ["nemo:owl2-rl", "jena:owl-horst", "graphdb:owl2-rl", "rdfox:owl2-rl", "qlever:rewritten", "oxigraph:rewritten", "virtuoso:rewritten"]
guards = ["modules for recursive shapes: an equivalence property by union-find"]
rewrite = "expressible"
[[case]]
name = "rl-sameas"
area = "reasoning"
what = "owl:sameAs chains: 20,000 groups of 10, a value each, spread to the group (equality by representatives, expanded in the stack)"
