what = "COUNT … GROUP BY on one pattern, NOT EXISTS by a group walk, COUNT DISTINCT"
semantics = "none"
data = "social people=300000"
queries = "op-group"
metric = "sum_p50_ms"
check = { "q.tag-counts.rows" = "expect.tags_used", "q.untitled.value" = "400000" }
route = { "q.tag-counts.operators" = "has group count", "q.untitled.operators" = "has group walk" }
cap_gb = 6
systems = ["qlever:plain", "oxigraph:plain", "jena:plain", "virtuoso:plain"]
guards = ["group counts on the index", "distinct values by a group walk"]

