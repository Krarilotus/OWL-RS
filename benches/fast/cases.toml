route = {}
cap_gb = 6
systems = ["nemo:owl2-rl", "graphdb:owl2-rl", "rdfox:owl2-rl", "qlever:rewritten", "oxigraph:rewritten", "virtuoso:rewritten"]
guards = ["equality by representatives: facts over each class's smallest id, expanded at read time"]
rewrite = "not-expressible"
[[case]]
