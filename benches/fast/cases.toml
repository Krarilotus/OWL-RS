# --- maintenance: commits, deletions, readers -------------------------------------------------

[[case]]
name = "commits-readers"
area = "maintenance"
what = "1,000 one-person commits added then removed under OWL 2 RL, with 8 readers running queries"
semantics = "owl2-rl"
data = "churn people=200000 changes=500"
args = ["--reason", "owl2-rl", "--commits", "{data}.commits.ru", "--readers", "8"]
queries = "churn"
metric = "commits.p50_ms"
check = { "closure_after_commits.equal" = "true", "commits.commits" = 1000, "q.students.value" = "200000" }
route = { "commits.incremental" = "== true" }
cap_gb = 6
systems = ["graphdb:owl2-rl", "rdfox:owl2-rl"]

[[case]]
name = "commits-rdfs"
area = "maintenance"
what = "the same commits under RDFS, without readers"
semantics = "rdfs"
data = "churn people=200000 changes=500"
