[[case]]
name = "clients-lookups"
area = "query"
what = "32 concurrent clients doing point lookups for 20 s: throughput and p99"
semantics = "none"
data = "social people=300000"
queries = "lookups"
args = ["--clients", "32", "--duration-s", "20"]
metric = "clients.p99_ms"
check = { "q.name.rows" = 1 }
route = {}
cap_gb = 6
systems = ["virtuoso:plain", "qlever:plain", "oxigraph:plain", "jena:plain"]
home_turf = "virtuoso"

