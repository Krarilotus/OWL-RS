queries = "churn"
metric = "commits.p50_ms"
check = { "closure_after_commits.equal" = "true", "commits.commits" = 1000 }
route = { "commits.incremental" = "== true" }
cap_gb = 6
systems = ["graphdb:rdfs", "rdfox:rdfs"]

[[case]]
name = "commits-plain"
area = "maintenance"
what = "the same commits without reasoning: the store's own write path, 4 readers alongside"
