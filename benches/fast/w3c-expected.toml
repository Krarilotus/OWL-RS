# The W3C kits and suites the release gate requires (release_gate.py w3c; benches/PROTOCOL.md §5).
#
# Each [kit."CRATE:TEST"] is launched, in this order, by `release-gate.sh w3c` (release_gate.py
# w3c --run; nothing else lists them): it must exit 0 with passing libtest summaries, and `suites`
# are the suites whose counts its own log (or its `table`, which it writes as NRESE_W3C_OUT) reports.
# A kit that didn't run whole fails, whatever its log says. Every suite below is one kit's.
#
# Per suite at least `passed` (or `checked`, for a runner that counts what it checked, its listed
# failures among them), no failure beyond `failed` (0), at most the known `skipped` and `disputed`,
# and exactly `known` listed failures (the runner's expected-failures list; 0 when not given): a list
# that grows or shrinks changes `known` here in the same commit. A suite its runner reports per
# manifest also states how many manifests (`groups`): a line missing fails. A suite without counts (its data
# missing, its kit not run) fails. The numbers are the v2 merge gate's
# (docs/plan/2026-10-05-v2-merge-checklist.md §4: no wrong answers), as measured on the shared host
# on 14 Oct 2026 (v15-gate-w3c-3, v15-gate-w3c-dl); the kits after OWL 2 DL as measured on 21 Nov 2026
# at w3c/rdf-tests 56076c0. A suite that grows raises its count here in the same commit.
#
# Check every count here without the gate's receipts (no verdict), after scripts/fetch-w3c-tests.sh:
#     python3 benches/fast/release_gate.py w3c target/w3c-local --expected benches/fast/w3c-expected.toml --local

[kit."nrese-sparql:w3c_sparql11"]
suites = ["SPARQL 1.1", "SPARQL 1.2"]

[kit."nrese-sparql:geosparql_compliance"]
suites = ["GeoSPARQL"]

[kit."nrese-shacl:w3c_shacl"]
suites = ["SHACL Core", "SHACL-SPARQL"]

[kit."nrese-store:w3c_owl2_rl"]
suites = ["OWL 2 RL"]

[kit."nrese-dl:tableau_w3c"]
suites = ["OWL 2 DL"]
table = "tableau-w3c.tsv"

[kit."nrese-owl:w3c_owl2"]
suites = ["OWL 2 RDF/XML round trip", "OWL 2 profiles", "OWL 2 functional syntax"]

[kit."nrese-reasoner:w3c_n3_reasoner"]
suites = ["N3 reasoner"]

[kit."nrese-store:w3c_owl2_ql"]
suites = ["OWL 2 QL"]

[kit."nrese-rdf-io:w3c_rdf"]
suites = ["RDF 1.1 syntax", "RDF 1.2 syntax"]

[kit."nrese-rdf-io:w3c_jsonld"]
suites = ["JSON-LD 1.1"]

[kit."nrese-rdf-io:w3c_rdfc"]
suites = ["RDFC-1.0"]

[kit."nrese-rdf-io:w3c_n3"]
suites = ["N3 parser"]

[kit."nrese-sparql-syntax:w3c_syntax"]
suites = ["SPARQL syntax"]

