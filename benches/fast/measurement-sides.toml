# Sides measured at a reviewed commit on top of them (benches/PROTOCOL.md §5, "No thread started in
# a timed window"): the side's revision → its measurement commit, which changes nothing but its perf
# lab (crates/nrese-store/examples/) and has the revision as its only parent. release-gate.sh build
# builds and times that commit for the side and refuses any other (release_gate.py measured_at); the
# jobs take it as an input (measurement_inputs). Each commit is pushed as its ref, named for the
# side it carries and what it adds (main3sus, v15cus: main3s and v15c with the open printed in
# microseconds; v15cus's parse-only queries also give no rows, as the candidate's do; main3sfirst:
# main3sus with each query's first execution reported, as the candidate's and v1.5's are).

