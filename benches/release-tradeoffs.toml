# The owner-approved policy of the release gate (benches/PROTOCOL.md §5, "The release gate";
# benches/fast/release_gate.py load_policy): the one place that accepts what the bar forbids. The
# gate tolerates no loss in time or memory and no wrong answer. A loss is accepted only when a
# trade-off here covers it; a wrong answer only when an exception here names its case and outcome;
# a baseline left uncompared only when an absence here names its cases; a cost appearing where the
# baseline read below the counter's step only when an emerged entry here names it. Each is then reported in the verdict. Nothing else waives either: a case's declared `outcome` and
# `known` issue explain evidence, they grant nothing.
#
# `release-gate.sh verdict CAND ...` reads this file at the candidate's commit, never from a timed
# report: an entry counts for the candidates whose tree holds it.
#
# Only Johannes approves an entry (role.owners). Each carries `by = "Johannes"`, the `approved`
# date, a `reason`, his words (`quote`, verbatim) and where he said them (`source`). An entry
# without them makes the file an error, and the verdict NOT PASSED.
#
# A trade-off covers a loss when its case and dimension match (and its baseline, if `against` names
# one), the worse end of the loss's interval is at most `max_ratio`, and the paying win shows as
# `better` against the same baseline in the same report. Dimensions are as the report names them:
# time/<series>, memory/lifetime, memory/phase/<phase>, qps/<clients>, ...
#
# [[tradeoff]]
# case = "lab-olympics"
# dimension = "memory/lifetime"
# against = "main"                      # optional: base or main; omitted, either
# max_ratio = 1.10                      # the loss's interval may reach at most this ratio
# approved = "2026-10-20"
# by = "Johannes"
# reason = "the string interner's shards: 10 % more memory at load for loads 27 % faster"
# quote = "<his words, verbatim>"
# source = "<the thread and time, or the intent entry>"
# pays_with = { case = "load-entities", dimension = "time/_" }
#
# An exception accepts one outcome of one case (outcome: wrong; a declared limit needs none: it
# blocks where a baseline completes and is named where none does).
#
# [[exception]]
# case = "<a case of benches/cases>"
# outcome = "wrong"
# approved = "2026-11-09"
# by = "Johannes"
# reason = "<why it ships>"
# quote = "<his words, verbatim>"
# source = "<the thread and time, or the intent entry>"
#
# An absence accepts that a baseline isn't compared on some cases whose capability its product has
# but its measurement build can't run yet (a product that lacks it says so in the catalogue: the
# case's `absent`). Without one, such a case stays not compared and blocks. A timed block doesn't
# run the side on them; the verdict lists each as "not compared by the owner's decision".
#
# [[absence]]
# cases = ["commits-plain", "commits-readers"]   # or: pattern = "support-*" (one of the two)
# side = "main"
# reason = "main's measurement build has no commits mode"
# port = "<the package planned to compare them>"
# approved = "2026-11-11"
# by = "Johannes"
# quote = "<his words, verbatim>"
# source = "<the thread and time, or the intent entry>"
#
# An emerged entry accepts a cost appearing in a series the baseline reads below the counter's step
# in every block (the gate's `emerged`: a phase printing 0.0 on the baseline and a measurable time
# on the candidate). Without one it blocks. `max` is the largest candidate median it covers, in the
# dimension's unit; a larger one blocks again.
#
# [[emerged]]
# case = "el-classify"
# dimension = "time/prepare"
# against = "base"                      # optional: base or main; omitted, either
# max = 2.0                             # ms
# approved = "2026-11-14"
# by = "Johannes"
# reason = "<the check that costs it, and why it ships>"
# quote = "<his words, verbatim>"
# source = "<the thread and time, or the intent entry>"

# The release baselines' measurement builds can't run these cases yet, though their products
