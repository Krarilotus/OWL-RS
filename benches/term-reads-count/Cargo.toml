[package]
name = "term-reads-count"
description = "Count runner: instructions and allocations per row of committed term reads and a transaction's pending deltas"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

# A workspace of its own, with its own lock: a count job copies this directory into another
# checkout and checks that the checkout's crates, root manifest, lock and toolchain are its own.
[workspace]

[dependencies]
# The server's allocator (crates/nrese-server/src/main.rs), so the counts are the shipped build's.
mimalloc = { version = "0.1", default-features = false }
nrese-engine = { path = "../../crates/nrese-engine" }
nrese-rdf = { path = "../../crates/rdf/nrese-rdf" }
tempfile = "3.23.0"

[features]
# Test-only: tests/inject.rs's wrong view on one reader. Never in a counted build.
inject = []

[[test]]
name = "inject"
required-features = ["inject"]

# The root workspace's release profile (fat LTO, one codegen unit), which a workspace of its
# own doesn't inherit.
[profile.release]
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
