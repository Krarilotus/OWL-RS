# The systems of the benchmark suite and what each can do. A workload runs on a system
# only if the system has every capability the workload needs (workloads.toml);
# `suite.py` prints the resulting matrix.
#
# capabilities (one vocabulary for systems and workloads):
#   load, query, update          bulk load; SPARQL 1.1 query; SPARQL 1.1 update
#   reason-rdfs                  RDFS entailment (subClassOf, subPropertyOf, domain, range)
#   reason-owl-horst             RDFS plus the pD* OWL rules (inverse, transitive, symmetric,
#                                sameAs, functional, hasValue, someValuesFrom/allValuesFrom)
#   reason-owl2-rl               the OWL 2 RL/RDF rules
#   reason-owl2-ql               OWL 2 QL (by rewriting or materialisation)
#   reason-custom-rules          user-defined rules (datalog or the vendor's rule language)
#   rules-nary                   user rules over relations of any arity, not only triples
#   rules-negation               stratified negation in user rules
#   rules-arithmetic             arithmetic in user rules (`z := z1 + z2`)
#   reason-incremental           inferences maintained on insert and delete without
#                                rematerialising
#   consistency                  inconsistencies detected
#   explain                      a proof for an inferred statement or a violation
#   classify                     TBox classification (OWL 2 EL or DL)
#   shacl-core, shacl-sparql     SHACL validation
#   fulltext, geosparql, federation
#   rdf12                        statements about statements: RDF 1.2 triple terms and
#                                reifiers, or RDF-star's quoted triples (SPARQL-star)
#   vector                       k-nearest-neighbour search over embeddings
#
# `publish`: free = results may be published; permission = only with the vendor's written
# consent (benches/competitors/README.md). `runs`: how the suite can start it
# (suitekit/adapters.py): docker, apptainer (the same image as a SIF file), rootfs (the same
# image unpacked and run with bubblewrap, for a host without Docker), native (a host
# process); kit: only a kit outside the driver runs it.
# `variant-of`: another build of a system (a setting or a baseline branch); the status counts
# its gaps apart, as optional.
#
# The capabilities of the other systems are from their documentation. An adapter confirms
# them when it first runs, and a capability that turns out not to work is removed here
# with a note.

[nrese]
name = "NRESE"
publish = "free"
runs = ["docker", "rootfs", "apptainer", "native"]
capabilities = [
  "load", "query", "update",
  "reason-rdfs", "reason-owl-horst", "reason-owl2-rl", "reason-owl2-ql",
  "reason-custom-rules", "reason-incremental", "consistency", "explain",
  "shacl-core", "shacl-sparql", "fulltext", "federation", "geosparql", "classify",
  "rdf12", "vector",
]
# What the suite needs and NRESE lacks; each names its step in the parity plan.
# (reason-custom-rules: user rules in Notation3 since 2026-10-01; builtins and .pie import
# are B2's rest.) The rule engines' home turf (benches/reasoning/datalog, 12 Oct 2026)
# found the rest: NRESE's user rules are over triples, without negation or arithmetic, so
# Galen (ternary relations), Doop (arity up to 7, negation) and SSPE (path lengths added
# over a ternary relation) are not expressible. A scope question for the owner, not for
# v1.5's week; the three families wait in the backlog (suite/schedule.toml).
missing = { rules-nary = "not planned: user rules are over triples (Galen, Doop, SSPE need ternary and wider relations); owner's scope decision", rules-negation = "not planned: no negation in user rules (Doop's stratified negation); owner's scope decision", rules-arithmetic = "not planned: math builtins are B2's rest (SSPE adds path lengths); owner's scope decision" }

# The same server with FSST-compressed vocabularies (`store.vocabulary = "fsst"`): next to
# `nrese` (plain, the default) it shows the trade-off of a smaller store and less memory
# against decoding the terms a query reads (office PC: stores 12–16 % smaller, memory 16–25 %
# lower, query totals even, a scan of the dictionary 14 % slower).
[nrese-fsst]
name = "NRESE (FSST vocabulary)"
variant-of = "nrese"
publish = "free"
runs = ["docker", "rootfs", "apptainer", "native"]
capabilities = [
  "load", "query", "update",
  "reason-rdfs", "reason-owl-horst", "reason-owl2-rl", "reason-owl2-ql",
  "reason-custom-rules", "reason-incremental", "consistency", "explain",
  "shacl-core", "shacl-sparql", "fulltext", "federation", "geosparql", "classify",
  "rdf12", "vector",
]
missing = {}

