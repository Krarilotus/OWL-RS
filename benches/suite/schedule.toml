# The order the benchmark families are measured in (the owner, 12 Oct 2026): what completes
# the suite this week first, in this order; then the backlog; last the families not
# expected to give data for polishing or optimisation. Every workload of workloads.toml is
# in exactly one list, and so is every catalogued benchmark without a workload yet
# (`catalogue`), so that nothing gets lost (suite.py --check). The measurement queue starts
# jobs in this order (suite/queue.py: a job's workload, or its cases' workload), and
# benches/STATUS.md shows it.

