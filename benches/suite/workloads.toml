# The workloads of the benchmark suite: what each measures, what a system needs to run
# it, where it comes from, and whether the repository can run it today.
#
# kind:    performance (times and sizes are the result) or conformance (pass counts)
# tasks:   RT1 to RT7 of docs/design/reasoning-benchmark.md, or the basics
# needs:   capabilities from systems.toml; `any` lists alternatives (one is enough)
# state:   ready (a kit in this repository runs it), partial, planned (to add),
#          blocked (waits for an NRESE capability: `waits-for`)
# The suite's driver (suite.py run) runs the workloads suitekit/workloads.py defines;
# the others it lists as not run.
# check:   how a result is verified before its time counts
# tiers:   the standard tiers: the sizes a full comparison runs (benches/STATUS.md counts
#          coverage against them; other tiers can run too)

# --- reasoning ---------------------------------------------------------------------------

[lubm]
title = "LUBM: universities, 14 queries"
kind = "performance"
tasks = ["RT1", "RT3", "RT2", "RT5"]
needs = ["load"]
any = ["reason-owl2-rl", "reason-owl-horst"]
scales = "1, 10, 100, 1000 universities (0.1 to 130 M statements)"
source = "UBA generator (rvesse/lubm-uba), univ-bench ontology"
licence = "GPL-2.0 (generator); data is generated"
tiers = ["1", "10", "100", "1000"]
state = "ready"
kit = "benches/reasoning"
check = "inferred set against owlrl or Nemo; the published answers for LUBM(1)"
note = "The standard materialisation benchmark; GraphDB and RDFox publish numbers on it"

[lubm-materialised]
title = "LUBM with the closure precomputed: the 14 queries on every SPARQL engine"
kind = "performance"
tasks = ["RT5"]
needs = ["load", "query"]
scales = "1, 10, 100 universities (closure of 0.1 to 13.9 M statements)"
source = "the lubm workload's data, closed under OWL 2 RL by NRESE (benches/reasoning/prepare-lubm-materialised.sh)"
licence = "GPL-2.0 (generator); data is generated"
tiers = ["1", "10", "100"]
state = "ready"
kit = "benches/reasoning"
check = "row counts across systems; the published answers for LUBM(1)"
note = "Query engines without a reasoner compete on their own turf: no inference cost, same closed data"

