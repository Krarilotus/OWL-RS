# The seeded random and fuzz tests a seed sweep runs (scripts/seed-sweep.py): each reads
# NRESE_FUZZ_SEED. Per target the crate, its test target (or lib) and the filters naming the
# seeded tests (libtest runs any test a filter is a substring of). Found on refactor/engine-v2,
# 13 Oct 2026; add a target when a seeded test is added. Each test runs under its target's
# memory_mib (default 4000, scripts/seed-sweep.py --memory-mib); a chunk's cap must hold the largest.

[[target]]
crate = "nrese-dl"
test = "bounds"
filters = ["u1_is_a_model_when_clash_free_and_contains_l"]

[[target]]
crate = "nrese-dl"
test = "classify"
filters = ["taxonomies_equal_brute_force", "types_equal_brute_force"]

[[target]]
crate = "nrese-dl"
test = "islands"
filters = ["islands_decide_as_the_whole_abox_does", "touched_islands_decide_as_a_cold_check_does"]

[[target]]
crate = "nrese-dl"
test = "tableau_fuzz"
filters = ["answers_agree_with_the_semantics"]
# Seed 600026 needs 6,062 MiB (14 Oct 2026, reproduced on the main PC: every answer right).
memory_mib = 8192

[[target]]
crate = "nrese-engine"
lib = true
filters = ["index::model_tests::random_commits_with_policy_compaction_match_the_model",
           "index::model_tests::arbitrary_compaction_windows_preserve_contents",
           "index::model_tests::old_versions_are_unaffected_by_later_writes",
           "index::model_tests::default_graph_versions_turn_into_quad_versions_at_a_named_graph",
           "engine::snapshot::point_tests::a_point_read_answers_the_quads_a_pattern_read_answers"]

[[target]]
crate = "nrese-engine"
test = "it"
filters = ["inferred_stack_tests::both_stacks_match_the_model_with_compaction",
           "inferred_stack_tests::both_stacks_survive_checkpoints_and_reopening"]

[[target]]
crate = "nrese-fuzz"
test = "it"
filters = ["parsers_hold_on_their_corpora_and_mutations"]

[[target]]
crate = "nrese-owl"
test = "models"
filters = ["clauses_and_ontologies_have_the_same_models"]

[[target]]
crate = "nrese-reasoner"
lib = true
filters = ["representatives_expand_to_the_replicated_closure", "every_maintenance_plan_keeps_the_stack_equal_to_recomputation", "delta_equals_rematerialisation_under_random_changes",
           "in_place_drivers_visit_what_a_scan_visits", "every_profile_batch_equals_naive",
           "hidden_unnamed_classes_leave_the_rest_of_the_closure",
           "guarded_maintenance_equals_rematerialisation_over_representatives", "delta_equality_equals_rematerialisation",
           "materialisation_stops_when_asked", "batch_equals_naive_on_random_ontologies",
           "graph_sets::tests::support_sets_give_the_closure_of_each_set_of_graphs",
           "graph_sets::tests::updates_equal_recomputation"]

[[target]]
crate = "nrese-server"
test = "it"
filters = ["http_fuzz_tests::random_requests_get_answers_not_server_errors",
           "http_fuzz_tests::random_requests_with_tokens_get_answers_not_server_errors"]

[[target]]
crate = "nrese-shacl"
test = "it"
filters = ["incremental_tests::incremental_validation_equals_the_difference_of_full_validations"]

[[target]]
crate = "nrese-sparql"
test = "it"
filters = ["native_differential_tests::native_results_equal_the_reference_on_random_queries",
           "native_differential_tests::pushed_filters_equal_the_reference",
           "native_differential_tests::paths_from_bound_values_equal_the_reference",
           "native_differential_tests::open_closures_and_their_counts_equal_the_reference",
           "native_differential_tests::computed_values_equal_the_reference",
           "native_differential_tests::duplicate_insensitive_queries_equal_both_evaluations",
           "native_differential_tests::joins_on_unbound_variables_equal_the_reference",
           "native_differential_tests::cyclic_bgps_equal_the_reference",
           "native_differential_tests::construct_equals_the_reference",
           "native_differential_tests::graph_patterns_equal_the_reference",
           "native_differential_tests::string_functions_casts_and_group_concat_equal_the_reference",
           "native_differential_tests::native_updates_equal_the_reference",
           "native_differential_tests::direct_results_equal_the_results_serialiser",
           "native_differential_tests::the_merged_default_graph_equals_the_reference",
           "native_differential_tests::updates_over_the_merged_default_graph_equal_the_reference",
           "native_differential_tests::datasets_and_graph_patterns_equal_the_reference",
           "native_differential_tests::updates_with_a_dataset_equal_the_reference",
           "native_differential_tests::joins_over_graph_sets_by_probes_and_by_scans_equal_the_reference",
           "native_differential_tests::exists_equal_the_reference",
           "native_differential_tests::describe_equals_the_reference",
           "native_differential_tests::the_remaining_functions_run_natively",
           "native_differential_tests::sideways_joins_equal_the_reference",
           "native_differential_tests::multi_operation_updates_equal_the_reference",
           "native_differential_tests::identity_classes_shrink_detached_optionals",
           "native_differential_tests::triple_terms_and_base_directions_equal_the_reference",
           "native_differential_tests::reified_edges_hop_through_triple_terms_as_the_reference",
           "native_differential_tests::grouped_cross_products_equal_the_reference",
           "native_differential_tests::equalities_across_patterns_equal_the_reference",
           "native_differential_tests::streamed_groups_equal_the_reference",
           "native_differential_tests::eager_aggregation_equals_the_reference_on_random_groups",
           "native_differential_tests::paths_ordered_with_patterns_equal_the_reference"]

[[target]]
crate = "nrese-store"
test = "it"
filters = ["equality_compact_tests::compact_equality_answers_as_replication_on_random_data",
           "equality_compact_tests::late_expansion_answers_as_early_expansion_and_replication",
           "dl_oracle_tests::generated_cases_answer_as_the_dl_oracle"]
