# The seeded random and fuzz tests a seed sweep runs (scripts/seed-sweep.py): each reads
# NRESE_FUZZ_SEED. Per target the crate, its test target (or lib) and the filters naming the
# seeded tests (libtest runs any test a filter is a substring of). Found on refactor/engine-v2,
# 13 Oct 2026; add a target when a seeded test is added. Each test runs under its target's
# memory_mib (default 4000, scripts/seed-sweep.py --memory-mib); a chunk's cap must hold the largest.

[[target]]
crate = "nrese-dl"
test = "bounds"
filters = ["u1_is_a_model_when_clash_free_and_contains_l"]

[[target]]
crate = "nrese-dl"
test = "classify"
filters = ["taxonomies_equal_brute_force", "types_equal_brute_force"]

[[target]]
crate = "nrese-dl"
test = "islands"
filters = ["islands_decide_as_the_whole_abox_does", "touched_islands_decide_as_a_cold_check_does"]

[[target]]
crate = "nrese-dl"
test = "tableau_fuzz"
filters = ["answers_agree_with_the_semantics"]
# Seed 600026 needs 6,062 MiB (14 Oct 2026, reproduced on the main PC: every answer right).
memory_mib = 8192

[[target]]
crate = "nrese-engine"
lib = true
filters = ["random_commits_with_policy_compaction_match_the_model", "arbitrary_compaction_windows_preserve_contents"]

[[target]]
crate = "nrese-engine"
test = "it"
filters = ["both_stacks_match_the_model_with_compaction", "both_stacks_survive_checkpoints_and_reopening"]

[[target]]
crate = "nrese-fuzz"
test = "it"
filters = ["parsers_hold_on_their_corpora_and_mutations"]

[[target]]
crate = "nrese-owl"
test = "models"
filters = ["clauses_and_ontologies_have_the_same_models"]

[[target]]
crate = "nrese-reasoner"
lib = true
filters = ["every_maintenance_plan_keeps_the_stack_equal_to_recomputation", "delta_equals_rematerialisation_under_random_changes",
           "closed_families_skip_their_own_output_exactly", "in_place_drivers_visit_what_a_scan_visits",
           "list_rules_follow_list_edits_under_the_delta_executor"]

[[target]]
crate = "nrese-server"
test = "it"
filters = ["random_requests_get_answers_not_server_errors", "random_requests_with_tokens_get_answers_not_server_errors"]

[[target]]
crate = "nrese-shacl"
test = "it"
filters = ["incremental_validation_equals_the_difference_of_full_validations"]

[[target]]
crate = "nrese-sparql"
test = "it"
filters = ["native_updates_equal_the_reference", "updates_over_the_merged_default_graph_equal_the_reference",
           "updates_with_a_dataset_equal_the_reference", "multi_operation_updates_equal_the_reference"]

[[target]]
crate = "nrese-store"
test = "it"
filters = ["compact_equality_answers_as_replication_on_random_data", "compact_equality_survives_a_restart"]
